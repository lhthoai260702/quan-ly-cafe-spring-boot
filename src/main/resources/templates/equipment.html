<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Quản lý thiết bị', 'equipment', ~{::main})}">
<head>
    <title>Quản lý thiết bị</title>
</head>
<body>
<main class="flex-1 p-6 md:p-8 overflow-y-auto bg-[#f9f9f7]">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4">
        <div>
            <h2 class="text-2xl font-bold text-[#1a1c1b] font-sans">Quản lý thiết bị & Tài sản</h2>
            <p class="text-sm text-[#50453e] opacity-80 mt-1">Quản lý số lượng, tình trạng và giá trị thiết bị của quán.</p>
        </div>
        <button onclick="document.getElementById('addModal').classList.remove('hidden')"
                class="flex items-center gap-2 bg-[#553722] hover:bg-[#6f4e37] text-white px-5 py-2.5 rounded-xl text-sm font-semibold uppercase tracking-wider transition-all duration-200 shadow-md">
            <i data-lucide="plus-circle" class="w-4 h-4"></i>
            Thêm thiết bị mới
        </button>
    </div>

    <div class="flex flex-col md:flex-row md:items-center justify-end gap-4 mb-6 bg-white p-4 rounded-2xl shadow-sm border border-[#e2e3e1]/30">
        <form th:action="@{/equipment}" method="GET" class="flex items-center bg-[#f4f4f2] rounded-full px-4 py-2.5 border border-[#e2e3e1]/20 max-w-md w-full">
            <i data-lucide="search" class="w-4 h-4 text-[#50453e] opacity-70 mr-2"></i>
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm tên thiết bị..."
                   class="bg-transparent border-none outline-none text-xs text-[#1a1c1b] w-full placeholder:text-[#50453e]/70 focus:ring-0 p-0" />
            <button type="submit" class="hidden"></button>
        </form>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div th:each="tb : ${equipments}" class="bg-white rounded-2xl p-5 shadow-sm border border-[#e2e3e1]/40 flex flex-col justify-between space-y-4 hover:shadow-md transition-shadow relative">
            <div class="flex items-start gap-4">
                <div class="w-12 h-12 rounded-xl overflow-hidden shrink-0 bg-[#ffdcc6]/30 text-[#553722] flex items-center justify-center border border-[#ffdcc6]/50">
                    <i data-lucide="monitor" class="w-6 h-6"></i>
                </div>

                <div class="min-w-0 flex-1">
                    <h4 class="text-sm font-bold text-[#1a1c1b] truncate" th:text="${tb.tenThietBi}">Tên thiết bị</h4>
                    <div class="flex items-center gap-1.5 text-xs text-[#50453e] opacity-80 mt-1">
                        <i data-lucide="layers" class="w-3 h-3 text-[#553722]"></i>
                        <span th:text="'Số lượng: ' + ${tb.soLuong}">Số lượng</span>
                    </div>
                    <div class="flex items-center gap-1.5 text-[11px] text-gray-500 mt-1">
                        <i data-lucide="banknote" class="w-3 h-3"></i>
                        <span th:text="'Đơn giá: ' + (${tb.donGiaMua != null ? #numbers.formatDecimal(tb.donGiaMua, 0, 'COMMA', 0, 'POINT') + ' VNĐ' : 'Chưa cập nhật'})">Đơn giá</span>
                    </div>
                </div>
            </div>

            <div class="space-y-1.5 border-t border-[#e2e3e1]/30 pt-3 text-[11px] text-[#50453e]">
                <div class="flex items-center gap-2">
                    <i data-lucide="calendar" class="w-3 h-3 text-gray-400 shrink-0"></i>
                    <span th:text="${tb.ngayMua != null ? 'Ngày mua: ' + #temporals.format(tb.ngayMua, 'dd/MM/yyyy') : 'Ngày mua: Chưa có'}">Ngày mua</span>                </div>
                <div class="flex items-start gap-2">
                    <i data-lucide="sticky-note" class="w-3 h-3 text-gray-400 shrink-0 mt-0.5"></i>
                    <span class="line-clamp-2" th:text="${tb.ghiChu != null and tb.ghiChu != '' ? tb.ghiChu : 'Không có ghi chú'}">Ghi chú</span>
                </div>
            </div>

            <div class="flex items-center justify-end gap-1.5 pt-2 border-t border-[#e2e3e1]/30">
                <button type="button"
                        th:data-id="${tb.maThietBi}"
                        th:data-name="${tb.tenThietBi}"
                        th:data-qty="${tb.soLuong}"
                        th:data-price="${tb.donGiaMua}"
                        th:data-date="${tb.ngayMua}"
                        th:data-note="${tb.ghiChu}"
                        onclick="openEditModal(this.getAttribute('data-id'), this.getAttribute('data-name'), this.getAttribute('data-qty'), this.getAttribute('data-price'), this.getAttribute('data-date'), this.getAttribute('data-note'))"
                        class="flex items-center gap-1 px-3 py-1.5 text-[10px] uppercase font-bold tracking-wider text-[#553722] bg-[#ffdcc6]/20 hover:bg-[#ffdcc6]/40 border border-[#ffdcc6]/30 rounded-lg duration-150 transition-all">
                    <i data-lucide="pen-line" class="w-3 h-3"></i>
                    Sửa
                </button>

                <button type="button"
                        th:data-id="${tb.maThietBi}"
                        th:data-name="${tb.tenThietBi}"
                        onclick="openDeleteModal(this.getAttribute('data-id'), this.getAttribute('data-name'))"
                        class="p-1.5 text-rose-600 hover:text-rose-700 hover:bg-rose-50 rounded-lg duration-150 transition-all block" title="Xóa thiết bị">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="addModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-[#1a1c1b]/50 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden border border-[#e2e3e1]">
            <div class="px-6 py-4 border-b border-[#e2e3e1]/60 flex justify-between items-center bg-[#f9f9f7]">
                <h3 class="text-lg font-bold text-[#1a1c1b]">Thêm thiết bị mới</h3>
                <button type="button" onclick="document.getElementById('addModal').classList.add('hidden')" class="text-[#50453e] hover:text-rose-600 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form th:action="@{/equipment/add}" method="POST" class="p-6">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Tên thiết bị</label>
                        <input type="text" name="tenThietBi" required class="w-full bg-[#f4f4f2] border border-[#e2e3e1] rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] focus:ring-1 focus:ring-[#553722] transition-all" placeholder="VD: Máy tính tiền POS">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Số lượng</label>
                            <input type="number" name="soLuong" min="1" required class="w-full bg-[#f4f4f2] border border-[#e2e3e1] rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] transition-all" placeholder="1">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Ngày mua</label>
                            <input type="date" name="ngayMua" class="w-full bg-[#f4f4f2] border border-[#e2e3e1] rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Đơn giá mua (VNĐ)</label>
                        <input type="number" name="donGiaMua" step="1000" class="w-full bg-[#f4f4f2] border border-[#e2e3e1] rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] transition-all" placeholder="VD: 5000000">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Ghi chú</label>
                        <textarea name="ghiChu" rows="3" class="w-full bg-[#f4f4f2] border border-[#e2e3e1] rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] transition-all" placeholder="Tình trạng, vị trí đặt..."></textarea>
                    </div>
                </div>
                <div class="mt-8 flex justify-end gap-3 pt-4 border-t border-[#e2e3e1]/60">
                    <button type="button" onclick="document.getElementById('addModal').classList.add('hidden')" class="px-5 py-2.5 rounded-xl text-sm font-bold text-[#50453e] bg-gray-100 hover:bg-gray-200 transition-all">
                        Hủy
                    </button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-bold text-white bg-[#553722] hover:bg-[#6f4e37] shadow-md transition-all flex items-center gap-2">
                        <i data-lucide="save" class="w-4 h-4"></i>
                        Lưu thiết bị
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="editModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-[#1a1c1b]/50 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden border border-[#e2e3e1]">
            <div class="px-6 py-4 border-b border-[#e2e3e1]/60 flex justify-between items-center bg-[#f9f9f7]">
                <h3 class="text-lg font-bold text-[#1a1c1b]">Cập nhật thiết bị</h3>
                <button type="button" onclick="document.getElementById('editModal').classList.add('hidden')" class="text-[#50453e] hover:text-rose-600 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form th:action="@{/equipment/edit}" method="POST" class="p-6">
                <input type="hidden" name="maThietBi" id="edit_maThietBi">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Tên thiết bị</label>
                        <input type="text" name="tenThietBi" id="edit_tenThietBi" required class="w-full bg-[#f4f4f2] border border-[#e2e3e1] rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] transition-all">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Số lượng</label>
                            <input type="number" name="soLuong" id="edit_soLuong" min="0" required class="w-full bg-[#f4f4f2] border border-[#e2e3e1] rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Ngày mua</label>
                            <input type="date" name="ngayMua" id="edit_ngayMua" class="w-full bg-[#f4f4f2] border border-[#e2e3e1] rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Đơn giá mua (VNĐ)</label>
                        <input type="number" name="donGiaMua" id="edit_donGiaMua" step="1000" class="w-full bg-[#f4f4f2] border border-[#e2e3e1] rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Ghi chú</label>
                        <textarea name="ghiChu" id="edit_ghiChu" rows="3" class="w-full bg-[#f4f4f2] border border-[#e2e3e1] rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] transition-all"></textarea>
                    </div>
                </div>
                <div class="mt-8 flex justify-end gap-3 pt-4 border-t border-[#e2e3e1]/60">
                    <button type="button" onclick="document.getElementById('editModal').classList.add('hidden')" class="px-5 py-2.5 rounded-xl text-sm font-bold text-[#50453e] bg-gray-100 hover:bg-gray-200 transition-all">
                        Hủy
                    </button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-bold text-white bg-[#553722] hover:bg-[#6f4e37] shadow-md transition-all flex items-center gap-2">
                        <i data-lucide="check" class="w-4 h-4"></i>
                        Lưu thay đổi
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="deleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-[#1a1c1b]/50 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden border border-[#e2e3e1]">
            <div class="p-6 text-center">
                <div class="w-14 h-14 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="alert-triangle" class="w-7 h-7"></i>
                </div>

                <h3 class="text-lg font-bold text-[#1a1c1b] mb-2">Xác nhận xóa thiết bị</h3>
                <p class="text-sm text-[#50453e] mb-6 leading-relaxed">
                    Bạn có chắc chắn muốn xóa <strong id="delete_tbName" class="text-rose-600"></strong> khỏi hệ thống? Thao tác này không thể hoàn tác!
                </p>

                <form th:action="@{/equipment/delete}" method="POST" class="flex justify-center gap-3">
                    <input type="hidden" name="maThietBi" id="delete_maThietBi">
                    <button type="button" onclick="document.getElementById('deleteModal').classList.add('hidden')" class="px-5 py-2.5 rounded-xl text-sm font-bold text-[#50453e] bg-gray-100 hover:bg-gray-200 transition-all flex-1">
                        Hủy bỏ
                    </button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-bold text-white bg-rose-600 hover:bg-rose-700 shadow-md transition-all flex-1">
                        Đồng ý xóa
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function openEditModal(id, name, qty, price, date, note) {
            document.getElementById('edit_maThietBi').value = id;
            document.getElementById('edit_tenThietBi').value = name;
            document.getElementById('edit_soLuong').value = qty;

            // Xử lý field giá trị null
            document.getElementById('edit_donGiaMua').value = (price && price !== 'null') ? price : '';
            document.getElementById('edit_ngayMua').value = (date && date !== 'null') ? date : '';
            document.getElementById('edit_ghiChu').value = (note && note !== 'null') ? note : '';

            document.getElementById('editModal').classList.remove('hidden');
        }

        function openDeleteModal(id, name) {
            document.getElementById('delete_maThietBi').value = id;
            document.getElementById('delete_tbName').textContent = name;
            document.getElementById('deleteModal').classList.remove('hidden');
        }
    </script>
</main>
</body>
</html>
