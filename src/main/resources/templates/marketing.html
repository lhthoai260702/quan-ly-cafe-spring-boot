<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Quản lý Marketing', 'megaphone', ~{::main})}">
<head>
    <title>Quản lý Marketing</title>
</head>
<body>
<main class="flex-1 p-4 md:p-8 overflow-y-auto bg-[#f9f9f7]">

    <div th:if="${successMsg}" class="mb-4 p-3 bg-green-100 text-green-700 rounded-lg text-sm"
         th:text="${successMsg}"></div>
    <div th:if="${errorMsg}" class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm" th:text="${errorMsg}"></div>

    <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 md:mb-8 gap-4">
        <div>
            <div class="flex items-center gap-3">
                <h2 class="text-xl md:text-2xl font-bold text-[#1a1c1b] font-sans">Quản lý Marketing & Khuyến Mãi</h2>
                <span class="bg-[#ffdcc6] text-[#553722] text-xs font-bold px-2.5 py-1 rounded-full shadow-sm whitespace-nowrap"
                      th:text="${totalItems != null ? totalItems : 0} + ' chương trình'">0 chương trình</span>
            </div>
            <p class="text-xs md:text-sm text-[#50453e] opacity-80 mt-1">Tổ chức sự kiện, phát hành mã giảm giá và kích
                cầu doanh thu.</p>
        </div>
        <button onclick="document.getElementById('addModal').classList.remove('hidden')"
                class="w-full md:w-auto justify-center flex items-center gap-2 bg-[#553722] hover:bg-[#6f4e37] text-white px-5 py-2.5 rounded-xl text-sm font-semibold uppercase tracking-wider transition-all shadow-md">
            <i data-lucide="ticket" class="w-4 h-4"></i> Tạo chương trình mới
        </button>
    </div>

    <div class="bg-white p-4 rounded-t-2xl shadow-sm border border-[#e2e3e1]/60 flex flex-col md:flex-row justify-end items-center gap-4">
        <form th:action="@{/marketing}" method="GET"
              class="flex items-center bg-[#f4f4f2] rounded-full px-4 py-2 border border-[#e2e3e1]/40 w-full md:max-w-md focus-within:ring-2 focus-within:ring-[#553722]/20 transition-all">
            <i data-lucide="search" class="w-4 h-4 text-[#50453e] opacity-70 mr-2 shrink-0"></i>
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm theo tên chương trình..."
                   class="bg-transparent border-none outline-none text-xs md:text-sm text-[#1a1c1b] w-full placeholder:text-[#50453e]/70 focus:ring-0 p-0"/>
            <button type="submit" class="hidden"></button>
        </form>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-[#e2e3e1]/40 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse table-auto">
                <thead>
                <tr class="bg-[#f4f4f2] text-[#50453e] text-[10px] uppercase tracking-wider font-bold border-b border-[#e2e3e1]/60">
                    <th class="p-3 text-center w-10">#</th>
                    <th class="p-3 min-w-[200px]">Tên chương trình</th>
                    <th class="p-3 text-center whitespace-nowrap">Thời gian</th>
                    <th class="p-3 text-center whitespace-nowrap">Loại KM</th>
                    <th class="p-3 text-right whitespace-nowrap">Giá trị giảm</th>
                    <th class="p-3 text-center whitespace-nowrap">Trạng thái</th>
                    <th class="p-3 text-center whitespace-nowrap">Thao tác</th>
                </tr>
                </thead>
                <tbody class="text-sm text-[#1a1c1b] divide-y divide-[#e2e3e1]/40">
                <tr th:each="km, iterStat : ${promotions}" class="hover:bg-[#f9f9f7]/50 transition-colors group">
                    <td class="p-3 text-center text-xs text-gray-400 font-medium"
                        th:text="${(currentPage - 1) * 10 + iterStat.count}"></td>

                    <td class="p-3 max-w-[250px] whitespace-normal break-words">
                        <div class="flex items-start gap-3">
                            <div class="w-8 h-8 rounded-lg bg-[#ffdcc6]/30 text-[#553722] flex items-center justify-center shrink-0 border border-[#ffdcc6]/50 mt-1">
                                <i data-lucide="ticket" class="w-4 h-4"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="font-bold text-[#1a1c1b] whitespace-normal break-words"
                                     th:text="${km.tenKhuyenMai}"></div>
                                <div class="text-[10px] text-gray-500 whitespace-normal break-words"
                                     th:text="${km.moTa}"></div>
                            </div>
                        </div>
                    </td>

                    <td class="p-3 text-center text-xs font-mono whitespace-nowrap"
                        th:text="${#temporals.format(km.ngayBatDau, 'dd/MM/yyyy') + ' - ' + #temporals.format(km.ngayKetThuc, 'dd/MM/yyyy')}"></td>

                    <td class="p-3 text-center whitespace-nowrap">
                        <span class="px-2 py-1 rounded text-[10px] uppercase font-bold"
                              th:classappend="${#strings.containsIgnoreCase(km.loaiKhuyenMai, 'phần') ? 'bg-purple-100 text-purple-700' : 'bg-amber-100 text-amber-700'}"
                              th:text="${km.loaiKhuyenMai}"></span>
                    </td>

                    <td class="p-3 text-right font-bold text-rose-600 whitespace-nowrap"
                        th:text="${#strings.containsIgnoreCase(km.loaiKhuyenMai, 'phần') ? (km.giaTriGiam + '%') : (#numbers.formatInteger(km.giaTriGiam, 0, 'COMMA') + ' VNĐ')}"></td>

                    <td class="p-3 text-center whitespace-nowrap">
                        <span class="px-2 py-1 rounded-full text-[10px] font-bold uppercase"
                              th:classappend="${km.trangThai == 'Đang diễn ra' ? 'bg-emerald-100 text-emerald-700' :
                                             (km.trangThai == 'Sắp diễn ra' ? 'bg-blue-100 text-blue-700' :
                                             (km.trangThai == 'Đã kết thúc' ? 'bg-rose-100 text-rose-700' : 'bg-gray-100 text-gray-500'))}"
                              th:text="${km.trangThai}"></span>
                    </td>

                    <td class="p-3 whitespace-nowrap">
                        <div class="flex items-center justify-center gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button type="button" class="p-1.5 text-[#553722] hover:bg-[#ffdcc6]/50 rounded-lg"
                                    title="Sửa"
                                    th:onclick="openEditModal([[${km.maKhuyenMai}]], [[${km.tenKhuyenMai}]], [[${km.ngayBatDau}]], [[${km.ngayKetThuc}]], [[${km.loaiKhuyenMai}]], [[${km.giaTriGiam}]], [[${km.moTa}]])">
                                <i data-lucide="pen-line" class="w-4 h-4"></i>
                            </button>
                            <button type="button" class="p-1.5 text-rose-500 hover:bg-rose-100 rounded-lg" title="Xóa"
                                    th:onclick="openDeleteModal([[${km.maKhuyenMai}]], [[${km.tenKhuyenMai}]])">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:if="${totalPages > 1}"
         th:with="
            startPage=${totalPages <= 5 ? 1 : (currentPage <= 3 ? 1 : (currentPage >= totalPages - 2 ? totalPages - 4 : currentPage - 2))},
            endPage=${totalPages <= 5 ? totalPages : (currentPage <= 3 ? 5 : (currentPage >= totalPages - 2 ? totalPages : currentPage + 2))}"
         class="flex justify-center items-center mt-8 gap-1.5 md:gap-2">

        <a th:if="${startPage > 1}"
           th:href="@{/marketing(page=1, keyword=${param.keyword})}"
           class="w-8 h-8 flex items-center justify-center rounded-lg border border-[#e2e3e1] bg-white text-[#50453e] hover:bg-[#f4f4f2] text-sm transition-colors shadow-sm">
            <i data-lucide="chevrons-left" class="w-4 h-4"></i>
        </a>

        <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
            <a th:href="@{/marketing(page=${i}, keyword=${param.keyword})}"
               th:text="${i}"
               th:classappend="${currentPage == i} ? 'bg-[#553722] text-white border-[#553722] shadow-md pointer-events-none' : 'bg-white text-[#50453e] border-[#e2e3e1] hover:bg-[#f4f4f2] shadow-sm'"
               class="w-8 h-8 flex items-center justify-center rounded-lg border text-xs font-bold transition-colors">
            </a>
        </th:block>

        <a th:if="${endPage < totalPages}"
           th:href="@{/marketing(page=${totalPages}, keyword=${param.keyword})}"
           class="w-8 h-8 flex items-center justify-center rounded-lg border border-[#e2e3e1] bg-white text-[#50453e] hover:bg-[#f4f4f2] text-sm transition-colors shadow-sm">
            <i data-lucide="chevrons-right" class="w-4 h-4"></i>
        </a>
    </div>

    <div id="addModal"
         class="hidden fixed inset-0 z-50 flex items-center justify-center bg-[#1a1c1b]/50 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="px-5 py-4 border-b border-[#e2e3e1]/60 flex justify-between shrink-0 bg-[#f9f9f7]">
                <h3 class="font-bold text-[#1a1c1b] flex items-center"><i data-lucide="ticket"
                                                                          class="w-4 h-4 inline-block mr-2 text-[#553722]"></i>Tạo
                    Khuyến Mãi Mới</h3>
                <button type="button" onclick="document.getElementById('addModal').classList.add('hidden')"
                        class="text-gray-400 hover:text-rose-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <form th:action="@{/marketing/add}" th:object="${addForm}" method="POST"
                  class="p-5 overflow-y-auto space-y-4 custom-validate-form" novalidate>

                <div>
                    <label class="block text-xs font-bold text-[#50453e] mb-1">Tên chương trình <span
                            class="text-rose-500">*</span></label>
                    <input type="text" th:field="*{tenKhuyenMai}" required maxlength="100"
                           title="Vui lòng nhập tên chương trình (tối đa 100 ký tự)"
                           th:classappend="${#fields.hasErrors('tenKhuyenMai')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1]'"
                           class="w-full bg-[#f4f4f2] border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#553722] transition-all">
                    <span th:if="${#fields.hasErrors('tenKhuyenMai')}" th:errors="*{tenKhuyenMai}"
                          class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1">Ngày bắt đầu <span
                                class="text-rose-500">*</span></label>
                        <input type="date" th:field="*{ngayBatDau}" id="add_start_date" required
                               title="Vui lòng chọn ngày bắt đầu"
                               th:classappend="${#fields.hasErrors('ngayBatDau')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1]'"
                               class="w-full bg-[#f4f4f2] border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#553722] transition-all">
                        <span th:if="${#fields.hasErrors('ngayBatDau')}" th:errors="*{ngayBatDau}"
                              class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1">Ngày kết thúc <span
                                class="text-rose-500">*</span></label>
                        <input type="date" th:field="*{ngayKetThuc}" id="add_end_date" required
                               title="Vui lòng chọn ngày kết thúc"
                               th:classappend="${#fields.hasErrors('ngayKetThuc')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1]'"
                               class="w-full bg-[#f4f4f2] border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#553722] transition-all">
                        <span th:if="${#fields.hasErrors('ngayKetThuc')}" th:errors="*{ngayKetThuc}"
                              class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1">Loại khuyến mãi <span
                                class="text-rose-500">*</span></label>
                        <select th:field="*{loaiKhuyenMai}" id="add_type" required title="Vui lòng chọn loại khuyến mãi"
                                th:classappend="${#fields.hasErrors('loaiKhuyenMai')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1]'"
                                class="w-full bg-[#f4f4f2] border border-[#e2e3e1] rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#553722] transition-all">
                            <option value="Phần trăm">Giảm theo % (Phần trăm)</option>
                            <option value="Số tiền">Giảm trực tiếp (Tiền mặt)</option>
                        </select>
                        <span th:if="${#fields.hasErrors('loaiKhuyenMai')}" th:errors="*{loaiKhuyenMai}"
                              class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1">Mức giảm <span class="text-rose-500">*</span></label>
                        <input type="text" id="add_val_display" required
                               th:classappend="${#fields.hasErrors('giaTriGiam')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1]'"
                               class="w-full bg-[#f4f4f2] border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#553722] transition-all">
                        <input type="hidden" th:field="*{giaTriGiam}" id="add_val_hidden">

                        <span th:if="${#fields.hasErrors('giaTriGiam')}" th:errors="*{giaTriGiam}"
                              class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-[#50453e] mb-1">Mô tả chi tiết</label>
                    <textarea th:field="*{moTa}" rows="2" maxlength="2000" title="Nhập mô tả chương trình"
                              th:classappend="${#fields.hasErrors('moTa')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1]'"
                              class="w-full bg-[#f4f4f2] border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#553722] transition-all"
                              placeholder="Điều kiện áp dụng..."></textarea>
                    <span th:if="${#fields.hasErrors('moTa')}" th:errors="*{moTa}"
                          class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                </div>

                <div class="pt-4 mt-2 border-t border-[#e2e3e1]/60 flex flex-col-reverse sm:flex-row justify-end gap-3">
                    <button type="button" onclick="document.getElementById('addModal').classList.add('hidden')"
                            class="w-full sm:w-auto px-4 py-2.5 rounded-xl text-sm font-bold bg-gray-100 hover:bg-gray-200 text-gray-600 transition-all text-center">
                        Hủy
                    </button>
                    <button type="submit"
                            class="w-full sm:w-auto px-4 py-2.5 rounded-xl text-sm font-bold bg-[#553722] hover:bg-[#6f4e37] text-white shadow-md transition-all text-center">
                        Lưu chương trình
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="editModal"
         class="hidden fixed inset-0 z-50 flex items-center justify-center bg-[#1a1c1b]/50 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="px-5 py-4 border-b border-[#e2e3e1]/60 flex justify-between shrink-0 bg-[#f9f9f7]">
                <h3 class="font-bold text-[#1a1c1b]">Cập nhật Khuyến Mãi</h3>
                <button type="button" onclick="document.getElementById('editModal').classList.add('hidden')"
                        class="text-gray-400 hover:text-rose-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <form th:action="@{/marketing/edit}" th:object="${editForm}" method="POST"
                  class="p-5 overflow-y-auto space-y-4 custom-validate-form" novalidate>
                <input type="hidden" th:field="*{maKhuyenMai}" id="edit_id">

                <div>
                    <label class="block text-xs font-bold text-[#50453e] mb-1">Tên chương trình <span
                            class="text-rose-500">*</span></label>
                    <input type="text" th:field="*{tenKhuyenMai}" id="edit_name" required maxlength="100"
                           title="Vui lòng nhập tên chương trình"
                           th:classappend="${#fields.hasErrors('tenKhuyenMai')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1]'"
                           class="w-full bg-[#f4f4f2] border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#553722] transition-all">
                    <span th:if="${#fields.hasErrors('tenKhuyenMai')}" th:errors="*{tenKhuyenMai}"
                          class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1">Ngày bắt đầu <span
                                class="text-rose-500">*</span></label>
                        <input type="date" th:field="*{ngayBatDau}" id="edit_start" required
                               title="Vui lòng chọn ngày bắt đầu"
                               th:classappend="${#fields.hasErrors('ngayBatDau')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1]'"
                               class="w-full bg-[#f4f4f2] border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#553722] transition-all">
                        <span th:if="${#fields.hasErrors('ngayBatDau')}" th:errors="*{ngayBatDau}"
                              class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1">Ngày kết thúc <span
                                class="text-rose-500">*</span></label>
                        <input type="date" th:field="*{ngayKetThuc}" id="edit_end" required
                               title="Vui lòng chọn ngày kết thúc"
                               th:classappend="${#fields.hasErrors('ngayKetThuc')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1]'"
                               class="w-full bg-[#f4f4f2] border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#553722] transition-all">
                        <span th:if="${#fields.hasErrors('ngayKetThuc')}" th:errors="*{ngayKetThuc}"
                              class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1">Loại khuyến mãi <span
                                class="text-rose-500">*</span></label>
                        <select th:field="*{loaiKhuyenMai}" id="edit_type" required
                                title="Vui lòng chọn loại khuyến mãi"
                                th:classappend="${#fields.hasErrors('loaiKhuyenMai')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1]'"
                                class="w-full bg-[#f4f4f2] border border-[#e2e3e1] rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#553722] transition-all">
                            <option value="Phần trăm">Giảm theo % (Phần trăm)</option>
                            <option value="Số tiền">Giảm trực tiếp (Tiền mặt)</option>
                        </select>
                        <span th:if="${#fields.hasErrors('loaiKhuyenMai')}" th:errors="*{loaiKhuyenMai}"
                              class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1">Mức giảm <span class="text-rose-500">*</span></label>
                        <input type="text" id="edit_val_display" required
                               th:classappend="${#fields.hasErrors('giaTriGiam')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1]'"
                               class="w-full bg-[#f4f4f2] border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#553722] transition-all">
                        <input type="hidden" th:field="*{giaTriGiam}" id="edit_val_hidden">

                        <span th:if="${#fields.hasErrors('giaTriGiam')}" th:errors="*{giaTriGiam}"
                              class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-[#50453e] mb-1">Mô tả chi tiết</label>
                    <textarea th:field="*{moTa}" id="edit_desc" rows="2" maxlength="2000"
                              title="Nhập mô tả chương trình"
                              th:classappend="${#fields.hasErrors('moTa')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1]'"
                              class="w-full bg-[#f4f4f2] border border-[#e2e3e1] rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#553722] transition-all"></textarea>
                    <span th:if="${#fields.hasErrors('moTa')}" th:errors="*{moTa}"
                          class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                </div>

                <div class="pt-4 mt-2 border-t border-[#e2e3e1]/60 flex flex-col-reverse sm:flex-row justify-end gap-3">
                    <button type="button" onclick="document.getElementById('editModal').classList.add('hidden')"
                            class="w-full sm:w-auto px-4 py-2.5 rounded-xl text-sm font-bold bg-gray-100 hover:bg-gray-200 text-gray-600 transition-all text-center">
                        Hủy
                    </button>
                    <button type="submit"
                            class="w-full sm:w-auto px-4 py-2.5 rounded-xl text-sm font-bold bg-[#553722] hover:bg-[#6f4e37] text-white shadow-md transition-all text-center">
                        Lưu thay đổi
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="deleteModal"
         class="hidden fixed inset-0 z-50 flex items-center justify-center bg-[#1a1c1b]/50 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl p-6 text-center overflow-hidden">
            <div class="w-14 h-14 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="alert-triangle" class="w-7 h-7"></i></div>
            <h3 class="font-bold text-lg mb-2">Dừng khuyến mãi</h3>
            <p class="text-sm text-gray-500 mb-6 leading-relaxed">Bạn có chắc muốn xóa chương trình <strong
                    id="delete_name" class="text-rose-600"></strong>?</p>
            <form th:action="@{/marketing/delete}" method="POST" class="flex flex-col sm:flex-row gap-3">
                <input type="hidden" name="maKhuyenMai" id="delete_id">
                <button type="button" onclick="document.getElementById('deleteModal').classList.add('hidden')"
                        class="w-full sm:flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 rounded-xl text-sm font-bold text-gray-600 transition-all order-2 sm:order-1">
                    Hủy
                </button>
                <button type="submit"
                        class="w-full sm:flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white shadow-md rounded-xl text-sm font-bold transition-all order-1 sm:order-2">
                    Đồng ý Xóa
                </button>
            </form>
        </div>
    </div>

    <script th:src="@{/js/marketing.js}"></script>
</main>
</body>
</html>
