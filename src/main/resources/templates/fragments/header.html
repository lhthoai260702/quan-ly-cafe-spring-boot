<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header"
        class="flex items-center justify-between px-4 md:px-8 py-4 bg-white/95 backdrop-blur-md border-b border-[#e2e3e1]/60 shadow-sm sticky top-0 z-30 transition-all">

    <div class="flex items-center gap-2 w-full max-w-md">

        <button onclick="toggleSidebar()"
                class="md:hidden p-2 hover:bg-[#f4f4f2] rounded-lg text-[#50453e] transition-colors">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>

        <div class="flex-1 flex items-center bg-[#f4f4f2] rounded-full px-4 py-2 border border-[#e2e3e1]/40 focus-within:bg-white focus-within:border-[#553722]/40 focus-within:shadow-sm transition-all">
            <i data-lucide="search" class="w-4 h-4 text-[#50453e] opacity-70 mr-2 shrink-0"></i>
            <input type="text"
                   placeholder="Tìm kiếm..."
                   class="bg-transparent border-none outline-none text-sm text-[#1a1c1b] w-full placeholder:text-[#50453e]/60 focus:ring-0 p-0"/>
        </div>
    </div>

    <div class="flex items-center gap-3 md:gap-6 ml-auto pl-4">

        <div class="h-8 w-[1px] bg-[#e2e3e1]/80"></div>

        <div class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition-opacity">
            <div class="text-right hidden md:block">
                <p class="text-sm font-bold text-[#1a1c1b]" th:text="${currentUser.hoTen}">Tên User</p>
                <p class="text-[11px] font-semibold text-[#50453e] uppercase tracking-wider"
                   th:text="${currentUser.getQuyenHanString()}">Chức vụ</p>
            </div>
            <div class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-slate-200 border border-[#e2e3e1] overflow-hidden shrink-0 shadow-sm">
                <img th:src="@{'/images/avatar/' + ${currentUser.anh}}" alt="Profile Avatar"
                     class="w-full h-full object-cover"
                     onerror="this.src='/images/user.png'"/>
            </div>
        </div>
    </div>
</header>
</body>
</html>
