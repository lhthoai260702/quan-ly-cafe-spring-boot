<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="flex items-center justify-between px-8 py-4 bg-[#f9f9f7] sticky top-0 z-30">

    <div class="flex items-center bg-[#f4f4f2] rounded-full px-4 py-2 border border-[#e2e3e1]/30 w-full max-w-md focus-within:bg-white focus-within:border-[#553722]/40 transition-all">
        <i data-lucide="search" class="w-4 h-4 text-[#50453e] opacity-70 mr-2"></i>
        <input type="text"
               placeholder="Hệ thống quản lý thông minh..."
               class="bg-transparent border-none outline-none text-sm text-[#1a1c1b] w-full placeholder:text-[#50453e]/60 focus:ring-0 p-0" />
    </div>

    <div class="flex items-center gap-6">
        <div class="flex items-center gap-3 text-[#50453e]">
            <button class="p-2 hover:bg-[#e8e8e6] rounded-full relative transition-colors">
                <i data-lucide="bell" class="w-5 h-5"></i>
                <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-rose-500 border border-white rounded-full"></span>
            </button>
            <button class="p-2 hover:bg-[#e8e8e6] rounded-full transition-colors">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="h-8 w-[1px] bg-[#e2e3e1]"></div>

        <div class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition-opacity">
            <div class="text-right hidden md:block">
                <p class="text-sm font-bold text-[#1a1c1b]" th:text="${currentUser.hoTen}">Tên User</p>
                <p class="text-[11px] font-semibold text-[#50453e] uppercase tracking-wider" th:text="${currentUser.getQuyenHanString()}">Chức vụ</p>
            </div>
            <div class="w-10 h-10 rounded-full bg-slate-200 border border-[#e2e3e1] overflow-hidden shrink-0">
                <img th:src="@{'/images/' + ${currentUser.anh}}" alt="Profile Avatar" class="w-full h-full object-cover" onerror="this.src='/images/admin.png'" />
            </div>
        </div>
    </div>
</header>
</body>
</html>
