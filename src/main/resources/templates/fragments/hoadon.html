<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<div th:fragment="nội_dung_hóa_đơn" class="p-4 md:p-6 flex flex-col h-full max-h-[90vh]">

    <div class="flex justify-between items-center pb-3 md:pb-4 border-b border-gray-100 shrink-0">
        <div>
            <h3 class="text-base md:text-lg font-extrabold text-[#553722]"
                th:text="${order.tenBan} + ' - CHI TIẾT GỌI MÓN'">BÀN X - CHI TIẾT GỌI MÓN</h3>
            <p class="text-[11px] md:text-xs text-gray-400 mt-0.5" th:if="${order.maHoaDon != null}">Mã hóa đơn: #<span
                    th:text="${order.maHoaDon}">0</span></p>
        </div>
        <button onclick="closeViewOrderModal()"
                class="text-gray-400 hover:text-rose-500 p-1.5 md:p-2 rounded-lg transition-all">
            <i class="fa-solid fa-xmark text-lg md:text-xl"></i>
        </button>
    </div>

    <div th:if="${#lists.isEmpty(order.danhSachMon)}"
         class="py-10 md:py-12 flex flex-col items-center justify-center text-center flex-1">
        <div class="p-3 md:p-4 bg-gray-50 rounded-full text-gray-300 mb-3">
            <i class="fa-solid fa-mug-hot text-3xl"></i>
        </div>
        <p class="text-xs md:text-sm font-semibold text-gray-500">Bàn hiện đang trống hoặc chưa gọi món</p>
        <p class="text-[10px] md:text-xs text-gray-400 mt-1 px-4">Sử dụng thanh chức năng phía dưới để mở order món mới
            cho khách.</p>
    </div>

    <form th:if="${!#lists.isEmpty(order.danhSachMon)}" th:action="@{/tables/checkout}" method="post"
          onsubmit="return validateCheckoutForm(this)"
          class="mt-4 w-full flex-1 flex flex-col lg:flex-row gap-4 md:gap-6 min-h-0 overflow-hidden">
        <input type="hidden" name="maBan" th:value="${order.maBan}">

        <div class="flex-1 flex flex-col min-h-0 border border-gray-100 shadow-sm rounded-xl overflow-hidden bg-white">
            <div class="overflow-y-auto overflow-x-auto custom-scrollbar flex-1">
                <table class="min-w-full text-left border-collapse whitespace-nowrap">
                    <thead class="sticky top-0 bg-gray-50 z-10 shadow-[0_1px_2px_rgba(0,0,0,0.05)]">
                    <tr class="text-[10px] md:text-[11px] font-bold uppercase tracking-wider text-gray-500 border-b border-gray-100">
                        <th class="py-2.5 md:py-3 px-3 md:px-4">Tên Món</th>
                        <th class="py-2.5 md:py-3 px-2 md:px-4 text-center">SL</th>
                        <th class="py-2.5 md:py-3 px-3 md:px-4 text-right hidden sm:table-cell">Đơn Giá</th>
                        <th class="py-2.5 md:py-3 px-3 md:px-4 text-right">Thành Tiền</th>
                    </tr>
                    </thead>
                    <tbody class="text-[11px] md:text-xs divide-y divide-gray-50 text-gray-700">
                    <tr th:each="mon : ${order.danhSachMon}" class="hover:bg-gray-50/80 transition-all bg-white">
                        <td class="py-2.5 md:py-3.5 px-3 md:px-4 font-semibold text-gray-800" th:text="${mon.tenMon}">Cà
                            Phê
                            Sữa Đá
                        </td>
                        <td class="py-2.5 md:py-3.5 px-2 md:px-4 text-center font-bold text-[#553722]"
                            th:text="${mon.soLuong}">2
                        </td>
                        <td class="py-2.5 md:py-3.5 px-3 md:px-4 text-right hidden sm:table-cell"
                            th:text="${#numbers.formatDecimal(mon.giaTaiThoiDiemBan, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">
                            25,000 VNĐ
                        </td>
                        <td class="py-2.5 md:py-3.5 px-3 md:px-4 text-right font-extrabold text-gray-950"
                            th:text="${#numbers.formatDecimal(mon.thanhTien, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">50,000
                            VNĐ
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="w-full lg:w-80 flex flex-col gap-3 shrink-0 overflow-y-auto lg:overflow-visible">

            <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm">
                <label class="block text-[11px] md:text-xs font-bold text-gray-700 mb-2">🏷️ Khuyến mãi:</label>
                <select name="maKhuyenMai" id="khuyenMaiSelect"
                        class="w-full px-3 py-2 border border-gray-200 rounded-lg text-xs font-semibold focus:outline-none focus:border-[#553722] focus:ring-1 focus:ring-[#553722] text-[#553722] transition-all cursor-pointer">
                    <option value="">-- Không áp dụng --</option>
                    <option th:each="km : ${danhSachKhuyenMai}"
                            th:value="${km.makhuyenmai}"
                            th:data-loai="${km.loaikhuyenmai}"
                            th:data-giatri="${km.giatrigiam}"
                            th:text="${km.tenkhuyenmai} + ' (' + (${#strings.containsIgnoreCase(km.loaikhuyenmai, 'phần')} ? ${km.giatrigiam} + '%' : ${#numbers.formatDecimal(km.giatrigiam, 0, 'COMMA', 0, 'POINT')} + 'VNĐ') + ')'">
                    </option>
                </select>
            </div>

            <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm flex flex-col gap-3">

                <div class="flex justify-between items-center bg-[#553722]/5 p-3 rounded-lg border border-[#553722]/10">
                    <div class="flex flex-col">
                        <span class="text-[10px] md:text-[11px] font-bold text-[#553722] uppercase tracking-wider">Tổng cộng:</span>
                        <span id="giamGiaText"
                              class="text-[10px] text-emerald-600 font-bold hidden mt-1">Đã giảm: 0 VNĐ</span>
                    </div>
                    <div class="text-right">
                        <span id="tongTienGoc" class="block text-[10px] text-gray-400 line-through hidden"
                              th:data-goc="${order.tongTien}"
                              th:text="${#numbers.formatDecimal(order.tongTien, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></span>
                        <span id="tongTienCuoi" class="text-base md:text-lg font-black text-[#553722]"
                              th:text="${#numbers.formatDecimal(order.tongTien, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</span>
                    </div>
                </div>

                <div class="pt-2">
                    <div class="flex justify-between items-center mb-2.5 gap-2">
                        <span class="text-[11px] font-bold text-gray-600 whitespace-nowrap">Khách đưa:</span>
                        <div class="relative w-full max-w-[130px]">
                            <input type="text" id="tienKhachDua" oninput="tinhTienThoi()" autocomplete="off"
                                   class="w-full text-right bg-gray-50 hover:bg-white border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs font-bold focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-[#553722] transition-all placeholder-gray-400"
                                   placeholder="Nhập số tiền...">
                        </div>
                    </div>
                    <div class="flex justify-between items-center bg-gray-50 px-3 py-2 rounded-lg border border-gray-100">
                        <span class="text-[11px] font-bold text-gray-600">Thối lại:</span>
                        <span id="tienThoiLai" class="text-[11px] font-bold text-gray-400">0 VNĐ</span>
                    </div>
                </div>
            </div>

            <div class="mt-auto flex flex-col gap-2 pt-2">
                <button type="submit"
                        class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl text-xs md:text-sm hover:bg-emerald-700 shadow-md shadow-emerald-600/20 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check"></i> Xác nhận thu tiền
                </button>
                <button type="button" onclick="closeViewOrderModal()"
                        class="w-full py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-xl text-xs font-bold transition-all text-center">
                    Bỏ qua
                </button>
            </div>
        </div>
    </form>
</div>

</body>
</html>
