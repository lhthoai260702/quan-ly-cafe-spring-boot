<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Trang Cá Nhân', 'user', ~{::main})}">
<head>
    <title>Trang Cá Nhân</title>
</head>
<body>
<main class="flex-1 p-4 md:p-10 overflow-y-auto bg-[#f9f9f7]">
    <div class="max-w-4xl mx-auto mb-6 md:mb-8">
        <h2 class="text-xl md:text-2xl font-bold text-[#1a1c1b]">Thông tin tài khoản</h2>
        <p class="text-xs md:text-sm text-[#50453e]/70 mt-1">Quản lý thông tin cá nhân và cài đặt bảo mật của bạn.</p>

        <div th:if="${successMsg}"
             class="mt-4 p-3 bg-emerald-50 border border-emerald-100 text-emerald-700 rounded-xl text-sm flex items-center gap-2">
            <i data-lucide="check-circle-2" class="w-4 h-4"></i>
            <span th:text="${successMsg}"></span>
        </div>
        <div th:if="${errorMsg}"
             class="mt-4 p-3 bg-rose-50 border border-rose-100 text-rose-700 rounded-xl text-sm flex items-center gap-2">
            <i data-lucide="alert-circle" class="w-4 h-4"></i>
            <span th:text="${errorMsg}"></span>
        </div>
    </div>

    <div class="max-w-4xl mx-auto bg-white rounded-3xl border border-[#e2e3e1]/50 shadow-sm overflow-hidden">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-0">
            <div class="md:col-span-4 bg-[#f4f4f2]/30 p-6 md:p-8 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-[#e2e3e1]/50">
                <div class="w-24 h-24 md:w-32 md:h-32 rounded-full ring-4 ring-white shadow-lg overflow-hidden mb-4 md:mb-6 bg-white">
                    <img id="avatarPreview"
                         th:src="@{'/images/avatar/' + ${currentUser.anh != null and currentUser.anh != '' ? currentUser.anh : 'user.png'}}"
                         alt="Avatar" class="w-full h-full object-cover"
                         onerror="this.src='/images/user.png'"/>
                </div>
                <h3 class="text-base md:text-lg font-bold text-[#1a1c1b] text-center" th:text="${currentUser.hoTen}">
                    Họ và Tên</h3>
                <p class="text-[10px] md:text-xs font-medium text-[#553722] uppercase tracking-wider bg-[#ffdcc6]/50 px-3 py-1 rounded-full mt-2"
                   th:text="${currentUser.tenChucVu}">Chức vụ</p>

                <button type="button"
                        onclick="document.getElementById('fileAnh').click()"
                        class="mt-4 md:mt-6 text-[10px] md:text-[11px] font-bold text-[#50453e]
               hover:text-[#553722] hover:scale-105
               transition-all duration-200
               uppercase border-b border-[#e2e3e1] pb-1">
                    Thay đổi ảnh
                </button>
            </div>

            <div class="md:col-span-8 p-6 md:p-8">
                <form id="logoutForm" th:action="@{/logout}" method="post"></form>

                <form id="updateForm" th:action="@{/profile/update}" th:object="${currentUser}" method="post"
                      enctype="multipart/form-data"
                      class="space-y-4 md:space-y-6 custom-validate-form" novalidate>

                    <input type="file" id="fileAnh" th:field="*{fileAnh}" accept="image/png, image/jpeg, image/jpg"
                           class="hidden" onchange="previewAvatar(event)"/>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6">
                        <div class="space-y-1.5 relative">
                            <label class="text-[10px] font-bold text-[#50453e] uppercase tracking-wider">Họ và tên <span
                                    class="text-rose-500">*</span></label>
                            <input type="text" th:field="*{hoTen}" required minlength="2"
                                   title="Họ tên phải có ít nhất 2 ký tự"
                                   th:classappend="${#fields.hasErrors('hoTen')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1] focus:border-[#553722] focus:ring-[#553722]/20'"
                                   class="w-full text-xs md:text-sm px-4 py-2.5 md:py-3 bg-white text-black rounded-xl outline-none focus:ring-2 border transition-all"/>
                            <span th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}"
                                  class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                        </div>

                        <div class="space-y-1.5 relative">
                            <label class="text-[10px] font-bold text-[#50453e] uppercase tracking-wider">Số điện thoại
                                <span class="text-rose-500">*</span></label>
                            <input type="text" th:field="*{soDienThoai}" required pattern="^0[35789]\d{8}$"
                                   title="Số điện thoại phải bắt đầu bằng 0 và có 10 chữ số"
                                   th:classappend="${#fields.hasErrors('soDienThoai')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1] focus:border-[#553722] focus:ring-[#553722]/20'"
                                   class="w-full text-xs md:text-sm px-4 py-2.5 md:py-3 bg-white text-black rounded-xl outline-none focus:ring-2 border transition-all"/>
                            <span th:if="${#fields.hasErrors('soDienThoai')}" th:errors="*{soDienThoai}"
                                  class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-[10px] font-bold text-[#50453e] uppercase tracking-wider">Lương
                                (VNĐ)</label>
                            <input type="text"
                                   th:value="${currentUser.luong != null ? #numbers.formatDecimal(currentUser.luong, 0, 'COMMA', 0, 'POINT') : '0'}"
                                   disabled
                                   class="w-full text-xs md:text-sm px-4 py-2.5 md:py-3 bg-[#f4f4f2] text-black disabled:bg-[#f4f4f2] disabled:text-black disabled:opacity-100 disabled:[-webkit-text-fill-color:black] rounded-xl border border-[#e2e3e1] cursor-not-allowed"/>
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-[10px] font-bold text-[#50453e] uppercase tracking-wider">Chức vụ</label>
                            <input type="text" th:value="${currentUser.tenChucVu}" disabled
                                   class="w-full text-xs md:text-sm px-4 py-2.5 md:py-3 bg-[#f4f4f2] text-black disabled:bg-[#f4f4f2] disabled:text-black disabled:opacity-100 disabled:[-webkit-text-fill-color:black] rounded-xl border border-[#e2e3e1] cursor-not-allowed"/>
                        </div>
                    </div>

                    <div class="pt-4 md:pt-6 border-t border-[#f4f4f2]">
                        <h4 class="text-[11px] md:text-xs font-bold text-[#553722] uppercase tracking-widest mb-3 md:mb-4">
                            Thông tin bảo mật</h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6">
                            <div class="space-y-1.5">
                                <label class="text-[10px] font-bold text-[#50453e] uppercase tracking-wider">Tên đăng
                                    nhập</label>
                                <input type="text" th:value="${currentUser.tenDangNhap}" disabled
                                       class="w-full text-xs md:text-sm px-4 py-2.5 md:py-3 bg-[#f4f4f2] text-black disabled:bg-[#f4f4f2] disabled:text-black disabled:opacity-100 disabled:[-webkit-text-fill-color:black] rounded-xl border border-[#e2e3e1] cursor-not-allowed"/>
                            </div>
                            <div class="space-y-1.5 relative">
                                <label class="text-[10px] font-bold text-[#50453e] uppercase tracking-wider">Mật khẩu
                                    mới</label>
                                <input type="password" th:field="*{matKhauMoi}" placeholder="Để trống nếu không đổi"
                                       minlength="6" title="Mật khẩu mới phải có ít nhất 6 ký tự"
                                       th:classappend="${#fields.hasErrors('matKhauMoi')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1] focus:border-[#553722] focus:ring-[#553722]/20'"
                                       class="w-full text-xs md:text-sm px-4 py-2.5 md:py-3 bg-white text-black rounded-xl outline-none focus:ring-2 border transition-all"/>
                                <span th:if="${#fields.hasErrors('matKhauMoi')}" th:errors="*{matKhauMoi}"
                                      class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col-reverse sm:flex-row items-center gap-3 md:gap-4 pt-4">
                        <button type="submit" form="logoutForm"
                                class="w-full sm:w-auto px-6 py-3 md:py-3.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-xl text-[11px] md:text-xs font-bold uppercase tracking-wider transition-all text-center">
                            Đăng xuất
                        </button>

                        <button type="submit"
                                class="w-full sm:flex-1 py-3 md:py-3.5 bg-[#553722] hover:bg-[#6f4e37] text-white rounded-xl text-[11px] md:text-xs font-bold uppercase tracking-wider transition-all shadow-md flex items-center justify-center gap-2">
                            <i data-lucide="save" class="w-4 h-4 hidden sm:block"></i> Lưu thay đổi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:src="@{/js/profile.js}"></script>
</main>
</body>
</html>
