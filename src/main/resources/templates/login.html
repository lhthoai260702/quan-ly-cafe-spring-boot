<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Đăng nhập - Café Harmony</title>

    <link rel="icon" type="image/png" th:href="@{/images/login.png}">

    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"/>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Hanken Grotesk', sans-serif; }

        /* Hiệu ứng chuyển động mượt mà cho các khối màu nền (Blobs) */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 8s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }
    </style>
</head>

<body class="bg-[#f4f4f2] text-[#1a1c1b] min-h-screen flex items-center justify-center relative overflow-hidden selection:bg-[#553722] selection:text-white">

<div class="absolute w-full h-full flex items-center justify-center overflow-hidden z-0 pointer-events-none">
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-[#ffdcc6] rounded-full mix-blend-multiply filter blur-3xl opacity-60 animate-blob"></div>
    <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-[#e2e3e1] rounded-full mix-blend-multiply filter blur-3xl opacity-60 animate-blob animation-delay-2000"></div>
    <div class="absolute bottom-1/4 left-1/3 w-96 h-96 bg-[#d1c4bc] rounded-full mix-blend-multiply filter blur-3xl opacity-60 animate-blob animation-delay-4000"></div>
</div>

<div class="relative z-10 w-full max-w-[420px] mx-4 bg-white/70 backdrop-blur-xl border border-white/60 shadow-[0_8px_30px_rgb(0,0,0,0.08)] rounded-3xl p-8 sm:p-10">

    <div class="text-center mb-8">
        <div class="w-16 h-16 bg-[#553722] rounded-2xl shadow-lg flex items-center justify-center mx-auto mb-4 transform rotate-3 hover:rotate-0 transition-transform duration-300">
            <i data-lucide="coffee" class="w-8 h-8 text-white"></i>
        </div>
        <h1 class="text-3xl font-bold text-[#1a1c1b] tracking-tight">Café Harmony</h1>
        <p class="text-sm text-[#50453e] mt-2 opacity-80">Đăng nhập để quản lý hệ thống</p>
    </div>

    <div th:if="${param.error}" class="mb-6 p-4 bg-rose-50 border border-rose-100 rounded-xl flex items-start gap-3 animate-pulse">
        <i data-lucide="alert-circle" class="w-5 h-5 text-rose-500 shrink-0 mt-0.5"></i>
        <p class="text-sm text-rose-700 font-medium">Tên đăng nhập hoặc mật khẩu không chính xác!</p>
    </div>
    <div th:if="${param.logout}" class="mb-6 p-4 bg-emerald-50 border border-emerald-100 rounded-xl flex items-start gap-3">
        <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-500 shrink-0 mt-0.5"></i>
        <p class="text-sm text-emerald-700 font-medium">Bạn đã đăng xuất thành công.</p>
    </div>

    <form th:action="@{/login}" method="POST" class="space-y-5">

        <div>
            <label for="username" class="block text-[11px] font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Tên đăng nhập</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i data-lucide="user" class="w-4 h-4 text-gray-400"></i>
                </div>
                <input type="text" id="username" name="username" required autofocus placeholder="Nhập tài khoản..."
                       class="w-full bg-white/80 border border-gray-200 rounded-xl pl-11 pr-4 py-3 text-sm text-[#1a1c1b] focus:bg-white focus:outline-none focus:border-[#553722] focus:ring-1 focus:ring-[#553722] transition-all placeholder:text-gray-400">
            </div>
        </div>

        <div>
            <div class="flex justify-between items-center mb-1.5">
                <label for="password" class="block text-[11px] font-bold text-[#50453e] uppercase tracking-wider">Mật khẩu</label>
                <a href="#" class="text-xs font-bold text-[#553722] hover:text-[#6f4e37] transition-colors">Quên mật khẩu?</a>
            </div>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i data-lucide="lock" class="w-4 h-4 text-gray-400"></i>
                </div>
                <input type="password" id="password" name="password" required placeholder="••••••••"
                       class="w-full bg-white/80 border border-gray-200 rounded-xl pl-11 pr-4 py-3 text-sm text-[#1a1c1b] focus:bg-white focus:outline-none focus:border-[#553722] focus:ring-1 focus:ring-[#553722] transition-all placeholder:text-gray-400">
            </div>
        </div>

        <div class="flex items-center pt-1 pb-2">
            <input type="checkbox" id="remember-me" name="remember-me"
                   class="w-4 h-4 text-[#553722] bg-white border-gray-300 rounded focus:ring-[#553722] cursor-pointer">
            <label for="remember-me" class="ml-2.5 block text-sm text-[#50453e] font-semibold cursor-pointer select-none">
                Ghi nhớ đăng nhập
            </label>
        </div>

        <button type="submit"
                class="w-full py-3.5 px-4 bg-[#553722] hover:bg-[#6f4e37] text-white font-bold rounded-xl shadow-md hover:shadow-lg transition-all duration-200 active:scale-[0.98] flex justify-center items-center gap-2 group">
            <span>Đăng nhập hệ thống</span>
            <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
        </button>
    </form>

    <div class="mt-8 pt-6 border-t border-gray-200/60 text-center">
        <p class="text-[11px] font-semibold text-[#50453e] opacity-60 uppercase tracking-wide">© 2026 Café Harmony</p>
    </div>
</div>

<script>
    lucide.createIcons();
</script>
</body>
</html>
