<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Quản lý Thực đơn', 'utensils-crossed', ~{::main})}">
<head>
    <title>Quản lý Thực đơn</title>
</head>
<body>
<main class="flex-1 p-4 md:p-8 overflow-y-auto bg-[#f9f9f7]">

    <div th:if="${successMsg}"
         class="mb-4 p-3 bg-green-100 text-green-700 rounded-lg text-sm font-medium flex items-center gap-2"
         th:text="${successMsg}"></div>
    <div th:if="${errorMsg}"
         class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm font-medium flex items-center gap-2"
         th:text="${errorMsg}"></div>

    <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 gap-4">
        <div>
            <div class="flex items-center gap-3">
                <h2 class="text-2xl font-bold text-[#1a1c1b] font-sans">Quản lý Thực đơn</h2>
                <span class="bg-[#ffdcc6] text-[#553722] text-xs font-bold px-2.5 py-1 rounded-full shadow-sm"
                      th:text="${totalItems != null ? totalItems : 0} + ' món'">0 món</span>
            </div>
            <p class="text-sm text-[#50453e] opacity-80 mt-1">Quản lý các món ăn, thức uống, giá bán và công thức chế
                biến.</p>
        </div>
        <button onclick="document.getElementById('addModal').classList.remove('hidden')"
                class="w-full md:w-auto justify-center flex items-center gap-2 bg-[#553722] hover:bg-[#6f4e37] text-white px-5 py-2.5 rounded-xl text-sm font-semibold uppercase tracking-wider transition-all duration-200 shadow-md">
            <i data-lucide="plus-circle" class="w-4 h-4"></i> Thêm món mới
        </button>
    </div>

    <div class="flex flex-col lg:flex-row lg:items-start justify-between gap-4 mb-6 bg-white p-4 rounded-2xl shadow-sm border border-[#e2e3e1]/40">
        <div class="flex flex-wrap gap-2 w-full lg:flex-1">
            <a th:href="@{/menu(category='all')}"
               th:classappend="${currentCategory == 'all' or currentCategory == null} ? 'bg-[#553722] text-white' : 'bg-[#f4f4f2] text-[#50453e] hover:bg-[#e8e8e6]'"
               class="px-4 py-2 rounded-full text-xs font-bold transition-all block text-center">Tất cả</a>
            <a th:each="cat : ${categories}" th:href="@{/menu(category=${cat})}" th:text="${cat}"
               th:classappend="${currentCategory == cat} ? 'bg-[#553722] text-white' : 'bg-[#f4f4f2] text-[#50453e] hover:bg-[#e8e8e6]'"
               class="px-4 py-2 rounded-full text-xs font-bold transition-all block text-center">Loại Món</a>
        </div>
        <form th:action="@{/menu}" method="GET"
              class="flex items-center bg-[#f4f4f2] rounded-full px-4 py-2 border border-[#e2e3e1]/20 w-full lg:max-w-md focus-within:ring-2 focus-within:ring-[#553722]/20 transition-all shrink-0">
            <i data-lucide="search" class="w-4 h-4 text-[#50453e] opacity-70 mr-2 shrink-0"></i>
            <input type="hidden" name="category" th:value="${currentCategory}">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm tên món..."
                   class="bg-transparent border-none outline-none text-sm text-[#1a1c1b] w-full placeholder:text-[#50453e]/60 focus:ring-0 p-0"/>
        </form>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-[#e2e3e1]/40 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse table-fixed min-w-[1024px]">
                <thead>
                <tr class="bg-[#f4f4f2] text-[#50453e] text-[10px] uppercase tracking-wider font-bold border-b border-[#e2e3e1]/60">
                    <th class="px-4 py-4 text-center w-12 whitespace-nowrap">#</th>
                    <th class="px-4 py-4 w-72">Tên món</th>
                    <th class="px-4 py-4 text-center w-48 whitespace-nowrap">Loại món</th>
                    <th class="px-4 py-4 text-right w-40 whitespace-nowrap">Giá bán</th>
                    <th class="px-4 py-4 text-center w-36 whitespace-nowrap">Thao tác</th>
                </tr>
                </thead>
                <tbody class="text-sm text-[#1a1c1b] divide-y divide-[#e2e3e1]/40">
                <th:block th:each="mon, iterStat : ${menuItems}">
                    <tr class="hover:bg-[#f9f9f7]/50 transition-colors group align-top cursor-pointer"
                        th:onclick="'toggleIngredientRow(' + ${mon.maThucDon} + ')'">
                        <td class="px-4 py-4 text-center text-xs text-gray-400 font-medium whitespace-nowrap"
                            th:text="${(currentPage - 1) * 10 + iterStat.count}">1
                        </td>
                        <td class="px-4 py-4">
                            <div class="flex items-center gap-3 max-w-full">
                                <div class="w-10 h-10 rounded-xl bg-[#f3e2ac]/40 text-[#6a5e33] flex items-center justify-center shrink-0 border border-[#e2e3e1]/60">
                                    <i data-lucide="coffee" class="w-5 h-5"></i>
                                </div>
                                <div class="min-w-0 flex-1">
                                    <div class="font-bold text-[#1a1c1b] whitespace-normal break-words leading-tight"
                                         th:text="${mon.tenMon}">Tên món
                                    </div>
                                </div>
                            </div>
                        </td>
                        <td class="px-4 py-4 text-center">
                            <span class="inline-block max-w-[160px] px-2.5 py-1 text-[10px] uppercase tracking-wider font-bold rounded-md border whitespace-normal break-words leading-relaxed mx-auto bg-amber-100 text-amber-700 border-amber-200"
                                  th:text="${mon.loaiMon != null ? mon.loaiMon : 'Khác'}">Loại món</span>
                        </td>
                        <td class="px-4 py-4 text-right font-bold text-amber-600 whitespace-nowrap"
                            th:text="${#numbers.formatDecimal(mon.giaTienHienTai, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0
                            VNĐ
                        </td>
                        <td class="px-4 py-4 whitespace-nowrap" onclick="event.stopPropagation()">
                            <div class="flex items-start justify-center gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity duration-150">
                                <button type="button" th:data-id="${mon.maThucDon}" th:data-name="${mon.tenMon}"
                                        th:data-price="${#numbers.formatInteger(mon.giaTienHienTai, 0)}"
                                        th:data-category="${mon.loaiMon}"
                                        onclick="openEditModal(this.getAttribute('data-id'), this.getAttribute('data-name'), this.getAttribute('data-price'), this.getAttribute('data-category'))"
                                        class="p-1.5 text-[#553722] hover:bg-[#ffdcc6]/50 rounded-lg transition-colors"
                                        title="Sửa hồ sơ">
                                    <i data-lucide="pen-line" class="w-4 h-4"></i>
                                </button>
                                <button type="button" th:data-id="${mon.maThucDon}" th:data-name="${mon.tenMon}"
                                        onclick="openDeleteModal(this.getAttribute('data-id'), this.getAttribute('data-name'))"
                                        class="p-1.5 text-rose-500 hover:text-rose-700 hover:bg-rose-100 rounded-lg transition-colors"
                                        title="Xóa hồ sơ">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </td>
                    </tr>

                    <tr th:id="'ingredient-view-' + ${mon.maThucDon}"
                        class="hidden bg-[#f4f4f2] border-t-0 shadow-inner">
                        <td colspan="5" class="px-6 py-4">
                            <div class="text-xs text-[#50453e] font-medium"
                                 th:id="'ingredient-content-' + ${mon.maThucDon}">
                                <span class="italic opacity-60">Đang tải nguyên liệu...</span>
                            </div>
                        </td>
                    </tr>
                </th:block>
                </tbody>
            </table>
        </div>
    </div>

    <template id="ingredientRowTemplate">
        <div class="flex items-center gap-3 ingredient-row bg-white p-3 rounded-xl border border-[#e2e3e1] shadow-sm transition-all hover:shadow-md">
            <div class="custom-combobox relative flex-1 group">
                <input type="hidden" class="ingredient-hidden-id" required>
                <div class="relative group/input">
                    <input type="text"
                           class="ingredient-search w-full bg-[#f9f9f7] border border-[#e2e3e1] rounded-lg pl-4 pr-10 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:bg-white focus:border-[#553722] focus:ring-4 focus:ring-[#553722]/10 transition-all placeholder:text-[#50453e]/60 font-medium"
                           placeholder="Gõ để tìm hoặc chọn nguyên liệu..."
                           oninput="filterCombobox(this)"
                           onfocus="openCombobox(this)"
                           onblur="closeCombobox(this)" autocomplete="off">
                    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-[#50453e] opacity-50 group-focus-within/input:opacity-100 group-focus-within/input:text-[#553722] transition-colors">
                        <i data-lucide="chevron-down" class="w-4 h-4"></i>
                    </div>
                </div>

                <ul class="combobox-list hidden absolute z-50 w-full bg-white border border-[#e2e3e1] rounded-xl mt-1.5 max-h-56 overflow-y-auto shadow-[0_10px_40px_-10px_rgba(0,0,0,0.1)] py-1.5 custom-scrollbar">

                    <li class="no-match-msg hidden px-4 py-2.5 text-[11px] uppercase tracking-wider text-rose-500 bg-rose-50/50 font-bold items-center gap-1.5 border-b border-rose-100/50 mb-1">
                        <i data-lucide="info" class="w-3.5 h-3.5"></i>
                        Không có kết quả, vui lòng chọn bên dưới:
                    </li>

                    <th:block th:if="${listHangHoa != null}">
                        <li th:each="hh : ${listHangHoa}"
                            th:data-id="${hh.maHangHoa}"
                            th:data-name="${hh.tenHangHoa}"
                            onmousedown="selectComboboxOption(this)"
                            class="combobox-item px-4 py-2.5 text-sm cursor-pointer hover:bg-[#ffdcc6]/60 hover:text-[#553722] text-[#1a1c1b] transition-colors flex items-center justify-between group/item">
                            <span class="font-bold" th:text="${hh.tenHangHoa}"></span>
                            <span class="text-[10px] uppercase font-bold text-[#50453e] opacity-60 group-hover/item:opacity-100 bg-[#f4f4f2] group-hover/item:bg-white group-hover/item:text-[#553722] px-2 py-0.5 rounded-md border border-[#e2e3e1]/50 transition-all"
                                  th:text="${hh.donViTinh != null ? hh.donViTinh.tenDonVi : 'Chưa rõ'}"></span>
                        </li>
                    </th:block>
                </ul>
            </div>

            <div class="relative w-32 shrink-0">
                <input type="number" step="0.01" min="0.01"
                       class="ingredient-qty w-full bg-[#f9f9f7] border border-[#e2e3e1] rounded-lg px-4 py-2.5 text-sm font-bold text-[#1a1c1b] focus:outline-none focus:bg-white focus:border-[#553722] focus:ring-4 focus:ring-[#553722]/10 transition-all text-center"
                       placeholder="Khối lượng" required>
            </div>

            <button type="button"
                    onclick="let container = this.closest('.space-y-2').id; this.closest('.ingredient-row').remove(); updateIngredientNames(container)"
                    class="p-2.5 text-rose-400 hover:text-rose-600 hover:bg-rose-50 border border-transparent hover:border-rose-100 rounded-lg transition-all shrink-0"
                    title="Xóa dòng">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
        </div>
    </template>

    <div id="addModal"
         class="hidden fixed inset-0 z-50 flex items-center justify-center bg-[#1a1c1b]/50 backdrop-blur-sm transition-opacity p-4">
        <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden border border-[#e2e3e1]">
            <div class="px-5 py-4 border-b border-[#e2e3e1]/60 flex justify-between items-center bg-[#f9f9f7] shrink-0">
                <h3 class="text-base md:text-lg font-bold text-[#1a1c1b]">Thêm món mới</h3>
                <button type="button" onclick="document.getElementById('addModal').classList.add('hidden')"
                        class="text-[#50453e] hover:text-rose-600 transition-colors"><i data-lucide="x"
                                                                                        class="w-5 h-5"></i></button>
            </div>
            <form th:action="@{/menu/add}" th:object="${addForm}" method="POST"
                  class="p-5 overflow-y-auto custom-validate-form" novalidate>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Tên món
                            <span class="text-rose-500">*</span></label>
                        <input type="text" th:field="*{tenMon}" required maxlength="100"
                               class="w-full bg-[#f4f4f2] border border-[#e2e3e1] rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] focus:ring-4 focus:ring-[#553722]/10 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Giá bán
                            (VNĐ) <span class="text-rose-500">*</span></label>
                        <input type="text" id="add_giaTien_display" required
                               oninput="formatCurrency(this, 'add_giaTienHienTai')"
                               class="w-full bg-[#f4f4f2] border border-[#e2e3e1] rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] focus:ring-4 focus:ring-[#553722]/10 transition-all">
                        <input type="hidden" th:field="*{giaTienHienTai}" id="add_giaTienHienTai">
                    </div>
                </div>

                <div class="mt-4">
                    <label class="block text-xs font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Loại món <span
                            class="text-rose-500">*</span></label>
                    <div class="relative">
                        <select name="loaiMon" id="add_loaiMon_select" required onchange="toggleLoaiMonKhac('add')"
                                class="w-full bg-[#f4f4f2] border border-[#e2e3e1] rounded-xl pl-4 pr-10 py-2.5 text-sm text-[#1a1c1b] appearance-none focus:outline-none focus:border-[#553722] focus:ring-4 focus:ring-[#553722]/10 transition-all">
                            <option value="" disabled selected>-- Chọn loại món --</option>
                            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                            <option value="Khác" class="font-bold text-[#553722] bg-[#ffdcc6]">➕ Khác (Thêm loại
                                mới...)
                            </option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-[#50453e] opacity-50">
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                    </div>
                    <input type="text" id="add_loaiMon_khac" placeholder="Nhập tên loại món mới..."
                           class="hidden mt-2 w-full bg-[#f9f9f7] border border-[#e2e3e1] rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] focus:ring-4 focus:ring-[#553722]/10 transition-all shadow-inner">
                </div>

                <div class="pt-4 border-t border-[#e2e3e1]/60 mt-4">
                    <div class="flex justify-between items-center mb-3">
                        <label class="block text-xs font-bold text-[#50453e] uppercase tracking-wider">Thành phần (Công
                            thức)</label>
                        <button type="button" onclick="addIngredientRow('add_ingredients_container')"
                                class="text-xs font-bold text-[#553722] bg-[#ffdcc6] px-3 py-1.5 rounded-lg flex items-center gap-1">
                            <i data-lucide="plus" class="w-3 h-3"></i> Thêm nguyên liệu
                        </button>
                    </div>
                    <div id="add_ingredients_container" class="space-y-2"></div>
                </div>

                <div class="mt-6 pt-4 flex justify-end gap-3 border-t border-[#e2e3e1]/60">
                    <button type="button" onclick="document.getElementById('addModal').classList.add('hidden')"
                            class="px-5 py-2.5 rounded-xl text-sm font-bold bg-gray-100">Hủy
                    </button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-bold text-white bg-[#553722]">Lưu
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="editModal"
         class="hidden fixed inset-0 z-50 flex items-center justify-center bg-[#1a1c1b]/50 backdrop-blur-sm transition-opacity p-4">
        <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden border border-[#e2e3e1]">
            <div class="px-5 py-4 border-b border-[#e2e3e1]/60 flex justify-between items-center bg-[#f9f9f7] shrink-0">
                <h3 class="text-base md:text-lg font-bold text-[#1a1c1b]">Cập nhật món</h3>
                <button type="button" onclick="document.getElementById('editModal').classList.add('hidden')"
                        class="text-[#50453e] hover:text-rose-600 transition-colors"><i data-lucide="x"
                                                                                        class="w-5 h-5"></i></button>
            </div>
            <form th:action="@{/menu/edit}" th:object="${editForm}" method="POST"
                  class="p-5 overflow-y-auto custom-validate-form" novalidate>
                <input type="hidden" th:field="*{maThucDon}" id="edit_maThucDon">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold mb-1.5 uppercase tracking-wider">Tên món</label>
                        <input type="text" th:field="*{tenMon}" id="edit_tenMon" required
                               class="w-full bg-[#f4f4f2] border border-[#e2e3e1] rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] focus:ring-4 focus:ring-[#553722]/10 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1.5 uppercase tracking-wider">Giá bán</label>
                        <input type="text" id="edit_giaTien_display" required
                               oninput="formatCurrency(this, 'edit_giaTienHienTai')"
                               class="w-full bg-[#f4f4f2] border border-[#e2e3e1] rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] focus:ring-4 focus:ring-[#553722]/10 transition-all">
                        <input type="hidden" th:field="*{giaTienHienTai}" id="edit_giaTienHienTai">
                    </div>
                </div>

                <div class="mt-4">
                    <label class="block text-xs font-bold mb-1.5 uppercase tracking-wider">Loại món</label>
                    <div class="relative">
                        <select name="loaiMon" id="edit_loaiMon_select" required onchange="toggleLoaiMonKhac('edit')"
                                class="w-full bg-[#f4f4f2] border border-[#e2e3e1] rounded-xl pl-4 pr-10 py-2.5 text-sm text-[#1a1c1b] appearance-none focus:outline-none focus:border-[#553722] focus:ring-4 focus:ring-[#553722]/10 transition-all">
                            <option value="" disabled>-- Chọn loại món --</option>
                            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                            <option value="Khác" class="font-bold text-[#553722] bg-[#ffdcc6]">➕ Khác (Thêm loại
                                mới...)
                            </option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-[#50453e] opacity-50">
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                    </div>
                    <input type="text" id="edit_loaiMon_khac" placeholder="Nhập tên loại món mới..."
                           class="hidden mt-2 w-full bg-[#f9f9f7] border border-[#e2e3e1] rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] focus:ring-4 focus:ring-[#553722]/10 transition-all shadow-inner">
                </div>

                <div class="pt-4 border-t border-[#e2e3e1]/60 mt-4">
                    <div class="flex justify-between items-center mb-3">
                        <label class="block text-xs font-bold text-[#50453e] uppercase tracking-wider">Thành phần (Công
                            thức)</label>
                        <button type="button" onclick="addIngredientRow('edit_ingredients_container')"
                                class="text-xs font-bold text-[#553722] bg-[#ffdcc6] px-3 py-1.5 rounded-lg flex items-center gap-1">
                            <i data-lucide="plus" class="w-3 h-3"></i> Thêm nguyên liệu
                        </button>
                    </div>
                    <div id="edit_ingredients_container" class="space-y-2">
                    </div>
                </div>

                <div class="mt-6 pt-4 flex justify-end gap-3 border-t border-[#e2e3e1]/60">
                    <button type="button" onclick="document.getElementById('editModal').classList.add('hidden')"
                            class="px-5 py-2.5 rounded-xl text-sm font-bold bg-gray-100">Hủy
                    </button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-bold text-white bg-[#553722]">Lưu
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="deleteModal"
         class="hidden fixed inset-0 z-50 flex items-center justify-center bg-[#1a1c1b]/50 backdrop-blur-sm transition-opacity p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden p-6 text-center">
            <h3 class="font-bold text-lg mb-2">Xác nhận gỡ món</h3>
            <p class="text-sm mb-4">Bạn có chắc chắn muốn xóa <strong id="delete_monName"
                                                                      class="text-rose-600"></strong>?</p>
            <form th:action="@{/menu/delete}" method="POST" class="flex justify-center gap-3">
                <input type="hidden" name="maThucDon" id="delete_maThucDon">
                <button type="button" onclick="document.getElementById('deleteModal').classList.add('hidden')"
                        class="px-4 py-2 bg-gray-100 rounded-lg">Hủy
                </button>
                <button type="submit" class="px-4 py-2 bg-rose-600 text-white rounded-lg">Đồng ý</button>
            </form>
        </div>
    </div>

    <script th:src="@{/js/menu.js}"></script>
</main>
</body>
</html>
