<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Quản lý Thực đơn', 'utensils-crossed', ~{::main})}">
<head>
    <title>Quản lý Thực đơn</title>
</head>
<body>
<main class="flex-1 p-4 md:p-8 overflow-y-auto bg-[#f9f9f7]">

    <div th:if="${successMsg}"
         class="mb-4 p-3 bg-green-100 text-green-700 rounded-lg text-sm font-medium flex items-center gap-2"
         th:text="${successMsg}"></div>
    <div th:if="${errorMsg}"
         class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm font-medium flex items-center gap-2"
         th:text="${errorMsg}"></div>

    <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 gap-4">
        <div>
            <div class="flex items-center gap-3">
                <h2 class="text-2xl font-bold text-[#1a1c1b] font-sans">Quản lý Thực đơn</h2>
                <span class="bg-[#ffdcc6] text-[#553722] text-xs font-bold px-2.5 py-1 rounded-full shadow-sm"
                      th:text="${totalItems != null ? totalItems : 0} + ' món'">0 món</span>
            </div>
            <p class="text-sm text-[#50453e] opacity-80 mt-1">Quản lý các món ăn, thức uống và cập nhật giá bán mới
                nhất.</p>
        </div>
        <button onclick="document.getElementById('addModal').classList.remove('hidden')"
                class="w-full md:w-auto justify-center flex items-center gap-2 bg-[#553722] hover:bg-[#6f4e37] text-white px-5 py-2.5 rounded-xl text-sm font-semibold uppercase tracking-wider transition-all duration-200 shadow-md">
            <i data-lucide="plus-circle" class="w-4 h-4"></i>
            Thêm món mới
        </button>
    </div>

    <div class="flex flex-col lg:flex-row lg:items-start justify-between gap-4 mb-6 bg-white p-4 rounded-2xl shadow-sm border border-[#e2e3e1]/40">
        <div class="flex flex-wrap gap-2 w-full lg:flex-1">
            <a th:href="@{/menu(category='all')}"
               th:classappend="${currentCategory == 'all' or currentCategory == null} ? 'bg-[#553722] text-white' : 'bg-[#f4f4f2] text-[#50453e] hover:bg-[#e8e8e6]'"
               class="px-4 py-2 rounded-full text-xs font-bold transition-all block text-center">Tất cả</a>
            <a th:each="cat : ${categories}" th:href="@{/menu(category=${cat})}" th:text="${cat}"
               th:classappend="${currentCategory == cat} ? 'bg-[#553722] text-white' : 'bg-[#f4f4f2] text-[#50453e] hover:bg-[#e8e8e6]'"
               class="px-4 py-2 rounded-full text-xs font-bold transition-all block text-center">Loại Món</a>
        </div>

        <form th:action="@{/menu}" method="GET"
              class="flex items-center bg-[#f4f4f2] rounded-full px-4 py-2 border border-[#e2e3e1]/20 w-full lg:max-w-md focus-within:ring-2 focus-within:ring-[#553722]/20 transition-all shrink-0">
            <i data-lucide="search" class="w-4 h-4 text-[#50453e] opacity-70 mr-2 shrink-0"></i>
            <input type="hidden" name="category" th:value="${currentCategory}">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm tên món..."
                   class="bg-transparent border-none outline-none text-sm text-[#1a1c1b] w-full placeholder:text-[#50453e]/60 focus:ring-0 p-0"/>
            <button type="submit" class="hidden"></button>
        </form>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-[#e2e3e1]/40 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse table-fixed min-w-[1024px]">
                <thead>
                <tr class="bg-[#f4f4f2] text-[#50453e] text-[10px] uppercase tracking-wider font-bold border-b border-[#e2e3e1]/60">
                    <th class="px-4 py-4 text-center w-12 whitespace-nowrap">#</th>
                    <th class="px-4 py-4 w-72">Tên món</th>
                    <th class="px-4 py-4 text-center w-48 whitespace-nowrap">Loại món</th>
                    <th class="px-4 py-4 text-right w-40 whitespace-nowrap">Giá bán</th>
                    <th class="px-4 py-4 text-center w-36 whitespace-nowrap">Thao tác</th>
                </tr>
                </thead>
                <tbody class="text-sm text-[#1a1c1b] divide-y divide-[#e2e3e1]/40">
                <tr th:if="${#lists.isEmpty(menuItems)}">
                    <td colspan="5" class="px-4 py-10 text-center text-[#50453e] opacity-70">
                        <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-3 opacity-50"></i>
                        <p>Không tìm thấy món nào phù hợp.</p>
                    </td>
                </tr>

                <tr th:each="mon, iterStat : ${menuItems}"
                    class="hover:bg-[#f9f9f7]/50 transition-colors group align-top">
                    <td class="px-4 py-4 text-center text-xs text-gray-400 font-medium whitespace-nowrap"
                        th:text="${(currentPage - 1) * 16 + iterStat.count}">1
                    </td>

                    <td class="px-4 py-4">
                        <div class="flex items-center gap-3 max-w-full">
                            <div class="w-10 h-10 rounded-xl bg-[#f3e2ac]/40 text-[#6a5e33] flex items-center justify-center shrink-0 border border-[#e2e3e1]/60">
                                <i data-lucide="coffee" class="w-5 h-5"></i>
                            </div>
                            <div class="min-w-0 flex-1">
                                <div class="font-bold text-[#1a1c1b] whitespace-normal break-words leading-tight"
                                     th:text="${mon.tenMon}">Tên món
                                </div>
                            </div>
                        </div>
                    </td>

                    <td class="px-4 py-4 text-center">
                            <span class="inline-block max-w-[160px] px-2.5 py-1 text-[10px] uppercase tracking-wider font-bold rounded-md border whitespace-normal break-words leading-relaxed bg-gray-100 text-gray-600 border-gray-200 mx-auto"
                                  th:text="${mon.loaiMon != null ? mon.loaiMon : 'Khác'}">Loại món</span>
                    </td>

                    <td class="px-4 py-4 text-right font-bold text-amber-600 whitespace-nowrap"
                        th:text="${#numbers.formatDecimal(mon.giaTienHienTai, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">
                        0 VNĐ
                    </td>

                    <td class="px-4 py-4 whitespace-nowrap">
                        <div class="flex items-start justify-center gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity duration-150">
                            <button type="button" th:data-id="${mon.maThucDon}" th:data-name="${mon.tenMon}"
                                    th:data-price="${#numbers.formatInteger(mon.giaTienHienTai, 0)}"
                                    th:data-category="${mon.loaiMon}"
                                    onclick="openEditModal(this.getAttribute('data-id'), this.getAttribute('data-name'), this.getAttribute('data-price'), this.getAttribute('data-category'))"
                                    class="p-1.5 text-[#553722] hover:bg-[#ffdcc6]/50 rounded-lg transition-colors"
                                    title="Sửa hồ sơ">
                                <i data-lucide="pen-line" class="w-4 h-4"></i>
                            </button>
                            <button type="button" th:data-id="${mon.maThucDon}" th:data-name="${mon.tenMon}"
                                    onclick="openDeleteModal(this.getAttribute('data-id'), this.getAttribute('data-name'))"
                                    class="p-1.5 text-rose-500 hover:text-rose-700 hover:bg-rose-100 rounded-lg transition-colors"
                                    title="Xóa hồ sơ">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:if="${totalPages > 1}"
         th:with="
            startPage=${totalPages <= 5 ? 1 : (currentPage <= 3 ? 1 : (currentPage >= totalPages - 2 ? totalPages - 4 : currentPage - 2))},
            endPage=${totalPages <= 5 ? totalPages : (currentPage <= 3 ? 5 : (currentPage >= totalPages - 2 ? totalPages : currentPage + 2))}"
         class="flex justify-center items-center mt-6 gap-1.5 md:gap-2">

        <a th:if="${startPage > 1}"
           th:href="@{/menu(page=1, category=${param.category}, keyword=${param.keyword})}"
           class="w-8 h-8 flex items-center justify-center rounded-lg border border-[#e2e3e1] bg-white text-[#50453e] hover:bg-[#f4f4f2] text-sm transition-colors shadow-sm">
            <i data-lucide="chevrons-left" class="w-4 h-4"></i>
        </a>

        <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
            <a th:href="@{/menu(page=${i}, category=${param.category}, keyword=${param.keyword})}"
               th:text="${i}"
               th:classappend="${currentPage == i} ? 'bg-[#553722] text-white border-[#553722] shadow-md pointer-events-none' : 'bg-white text-[#50453e] border-[#e2e3e1] hover:bg-[#f4f4f2] shadow-sm'"
               class="w-8 h-8 flex items-center justify-center rounded-lg border text-xs font-bold transition-colors">
            </a>
        </th:block>

        <a th:if="${endPage < totalPages}"
           th:href="@{/menu(page=${totalPages}, category=${param.category}, keyword=${param.keyword})}"
           class="w-8 h-8 flex items-center justify-center rounded-lg border border-[#e2e3e1] bg-white text-[#50453e] hover:bg-[#f4f4f2] text-sm transition-colors shadow-sm">
            <i data-lucide="chevrons-right" class="w-4 h-4"></i>
        </a>
    </div>

    <div id="addModal"
         class="hidden fixed inset-0 z-50 flex items-center justify-center bg-[#1a1c1b]/50 backdrop-blur-sm transition-opacity p-4">
        <div class="bg-white rounded-2xl w-full max-w-md max-h-[90vh] flex flex-col shadow-2xl overflow-hidden border border-[#e2e3e1]">
            <div class="px-5 py-4 border-b border-[#e2e3e1]/60 flex justify-between items-center bg-[#f9f9f7] shrink-0">
                <h3 class="text-base md:text-lg font-bold text-[#1a1c1b]">Thêm món mới</h3>
                <button type="button" onclick="document.getElementById('addModal').classList.add('hidden')"
                        class="text-[#50453e] hover:text-rose-600 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form th:action="@{/menu/add}" th:object="${addForm}" method="POST"
                  class="p-5 overflow-y-auto custom-validate-form" novalidate>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Tên món
                            *</label>
                        <input type="text" th:field="*{tenMon}" required title="Vui lòng không để trống tên món"
                               th:classappend="${#fields.hasErrors('tenMon')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1]'"
                               class="w-full bg-[#f4f4f2] border rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] transition-all"
                               placeholder="VD: Cà phê sữa đá">
                        <span th:if="${#fields.hasErrors('tenMon')}" th:errors="*{tenMon}"
                              class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Giá bán
                            (VNĐ) *</label>
                        <input type="number" th:field="*{giaTienHienTai}" min="0" step="500" required
                               title="Vui lòng nhập giá bán hợp lệ (không âm)"
                               th:classappend="${#fields.hasErrors('giaTienHienTai')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1]'"
                               class="w-full bg-[#f4f4f2] border rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] transition-all"
                               placeholder="25000">
                        <span th:if="${#fields.hasErrors('giaTienHienTai')}" th:errors="*{giaTienHienTai}"
                              class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Loại món
                            *</label>
                        <input list="categoryList" th:field="*{loaiMon}" required
                               title="Vui lòng chọn hoặc nhập loại món"
                               th:classappend="${#fields.hasErrors('loaiMon')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1]'"
                               class="w-full bg-[#f4f4f2] border rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] transition-all"
                               placeholder="Cà Phê, Trà, Nước Ép...">
                        <datalist id="categoryList">
                            <option th:each="cat : ${categories}" th:value="${cat}"></option>
                        </datalist>
                        <span th:if="${#fields.hasErrors('loaiMon')}" th:errors="*{loaiMon}"
                              class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                    </div>
                </div>
                <div class="mt-6 pt-4 border-t border-[#e2e3e1]/60 flex justify-end gap-3">
                    <button type="button" onclick="document.getElementById('addModal').classList.add('hidden')"
                            class="px-5 py-2.5 rounded-xl text-sm font-bold text-[#50453e] bg-gray-100 hover:bg-gray-200">
                        Hủy
                    </button>
                    <button type="submit"
                            class="px-5 py-2.5 rounded-xl text-sm font-bold text-white bg-[#553722] hover:bg-[#6f4e37] shadow-md flex items-center gap-2">
                        <i data-lucide="save" class="w-4 h-4"></i> Lưu
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="editModal"
         class="hidden fixed inset-0 z-50 flex items-center justify-center bg-[#1a1c1b]/50 backdrop-blur-sm transition-opacity p-4">
        <div class="bg-white rounded-2xl w-full max-w-md max-h-[90vh] flex flex-col shadow-2xl overflow-hidden border border-[#e2e3e1]">
            <div class="px-5 py-4 border-b border-[#e2e3e1]/60 flex justify-between items-center bg-[#f9f9f7] shrink-0">
                <h3 class="text-base md:text-lg font-bold text-[#1a1c1b]">Cập nhật món</h3>
                <button type="button" onclick="document.getElementById('editModal').classList.add('hidden')"
                        class="text-[#50453e] hover:text-rose-600 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form th:action="@{/menu/edit}" th:object="${editForm}" method="POST"
                  class="p-5 overflow-y-auto custom-validate-form" novalidate>
                <input type="hidden" th:field="*{maThucDon}" id="edit_maThucDon">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Tên món
                            *</label>
                        <input type="text" th:field="*{tenMon}" id="edit_tenMon" required
                               title="Vui lòng không để trống tên món"
                               th:classappend="${#fields.hasErrors('tenMon')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1]'"
                               class="w-full bg-[#f4f4f2] border rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] transition-all">
                        <span th:if="${#fields.hasErrors('tenMon')}" th:errors="*{tenMon}"
                              class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Giá bán
                            (VNĐ) *</label>
                        <input type="number" th:field="*{giaTienHienTai}" id="edit_giaTienHienTai" min="0" step="500"
                               required title="Vui lòng nhập giá bán hợp lệ (không âm)"
                               th:classappend="${#fields.hasErrors('giaTienHienTai')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1]'"
                               class="w-full bg-[#f4f4f2] border rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] transition-all">
                        <span th:if="${#fields.hasErrors('giaTienHienTai')}" th:errors="*{giaTienHienTai}"
                              class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#50453e] mb-1.5 uppercase tracking-wider">Loại món
                            *</label>
                        <input list="categoryListEdit" th:field="*{loaiMon}" id="edit_loaiMon" required
                               title="Vui lòng chọn hoặc nhập loại món"
                               th:classappend="${#fields.hasErrors('loaiMon')} ? 'border-rose-500 bg-rose-50' : 'border-[#e2e3e1]'"
                               class="w-full bg-[#f4f4f2] border rounded-xl px-4 py-2.5 text-sm text-[#1a1c1b] focus:outline-none focus:border-[#553722] transition-all">
                        <datalist id="categoryListEdit">
                            <option th:each="cat : ${categories}" th:value="${cat}"></option>
                        </datalist>
                        <span th:if="${#fields.hasErrors('loaiMon')}" th:errors="*{loaiMon}"
                              class="server-error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"></span>
                    </div>
                </div>
                <div class="mt-6 pt-4 border-t border-[#e2e3e1]/60 flex justify-end gap-3">
                    <button type="button" onclick="document.getElementById('editModal').classList.add('hidden')"
                            class="px-5 py-2.5 rounded-xl text-sm font-bold text-[#50453e] bg-gray-100 hover:bg-gray-200">
                        Hủy
                    </button>
                    <button type="submit"
                            class="px-5 py-2.5 rounded-xl text-sm font-bold text-white bg-[#553722] hover:bg-[#6f4e37] shadow-md flex items-center gap-2">
                        <i data-lucide="check" class="w-4 h-4"></i> Lưu
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="deleteModal"
         class="hidden fixed inset-0 z-50 flex items-center justify-center bg-[#1a1c1b]/50 backdrop-blur-sm transition-opacity p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden border border-[#e2e3e1]">
            <div class="p-6 text-center">
                <div class="w-14 h-14 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="alert-triangle" class="w-7 h-7"></i>
                </div>
                <h3 class="text-base md:text-lg font-bold text-[#1a1c1b] mb-2">Xác nhận gỡ món</h3>
                <p class="text-xs md:text-sm text-[#50453e] mb-6 leading-relaxed">
                    Bạn có chắc chắn muốn xóa <strong id="delete_monName" class="text-rose-600"></strong> khỏi thực đơn?
                </p>
                <form th:action="@{/menu/delete}" method="POST" class="flex justify-center gap-3">
                    <input type="hidden" name="maThucDon" id="delete_maThucDon">
                    <button type="button" onclick="document.getElementById('deleteModal').classList.add('hidden')"
                            class="px-5 py-2.5 rounded-xl text-sm font-bold text-[#50453e] bg-gray-100 hover:bg-gray-200 flex-1">
                        Hủy bỏ
                    </button>
                    <button type="submit"
                            class="px-5 py-2.5 rounded-xl text-sm font-bold text-white bg-rose-600 hover:bg-rose-700 shadow-md flex-1">
                        Đồng ý xóa
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        var hasAddError = /*[[${hasAddError != null ? hasAddError : false}]]*/ false;
        var hasEditError = /*[[${hasEditError != null ? hasEditError : false}]]*/ false;

        if (hasAddError) {
            document.getElementById('addModal').classList.remove('hidden');
        }
        if (hasEditError) {
            document.getElementById('editModal').classList.remove('hidden');
        }
        /*]]>*/

        function openEditModal(id, name, price, category) {
            document.getElementById('edit_maThucDon').value = id;
            document.getElementById('edit_tenMon').value = name;
            document.getElementById('edit_giaTienHienTai').value = price;
            document.getElementById('edit_loaiMon').value = (category && category !== 'null') ? category : '';
            document.getElementById('editModal').classList.remove('hidden');
        }

        function openDeleteModal(id, name) {
            document.getElementById('delete_maThucDon').value = id;
            document.getElementById('delete_monName').textContent = name;
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        document.addEventListener("DOMContentLoaded", function () {
            const forms = document.querySelectorAll(".custom-validate-form");
            forms.forEach(form => {
                form.addEventListener("submit", function (e) {
                    let isValid = true;
                    const inputs = form.querySelectorAll("input, select");

                    inputs.forEach(input => {
                        let existingError = input.parentElement.querySelector(".error-msg, .server-error-msg");
                        if (existingError) existingError.remove();
                        input.classList.remove("border-rose-500", "bg-rose-50");

                        if (!input.validity.valid) {
                            isValid = false;

                            input.classList.remove("border-[#e2e3e1]");
                            input.classList.add("border-rose-500", "bg-rose-50");

                            let errorText = input.getAttribute("title") || "Vui lòng nhập trường này hợp lệ.";
                            if (input.validity.valueMissing) {
                                errorText = "Trường này không được để trống.";
                            } else if (input.validity.rangeUnderflow) {
                                errorText = input.getAttribute("title") || "Giá trị không hợp lệ.";
                            }

                            let errorHtml = `<span class="error-msg text-[10px] text-rose-500 font-semibold block mt-1.5 ml-1 flex items-center gap-1"><i data-lucide="info" class="w-3 h-3"></i> ${errorText}</span>`;
                            input.insertAdjacentHTML("afterend", errorHtml);
                        }
                    });

                    if (!isValid) {
                        e.preventDefault();
                        if(typeof lucide !== 'undefined') lucide.createIcons();
                    }
                });

                form.querySelectorAll("input, select").forEach(input => {
                    input.addEventListener("input", function () {
                        let existingError = input.parentElement.querySelector(".error-msg, .server-error-msg");
                        if (existingError) existingError.remove();

                        input.classList.remove("border-rose-500", "bg-rose-50");
                        input.classList.add("border-[#e2e3e1]");
                    });
                });
            });
        });
    </script>
</main>
</body>
</html>
