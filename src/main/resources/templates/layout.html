<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, activeTab, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Café Harmony</title>

    <link rel="icon" type="image/png" th:href="@{'/images/icons/' + ${activeTab} + '.png'}">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#f9f9f7] font-sans text-[#1a1c1b] h-screen overflow-hidden flex relative">

<div th:replace="~{fragments/sidebar :: sidebar(${activeTab})}"></div>

<div id="mobile-overlay"
     class="fixed inset-0 bg-black/50 z-30 hidden md:hidden transition-opacity duration-300"
     onclick="toggleSidebar()">
</div>

<main id="main-content"
      class="flex-1 flex flex-col w-full md:ml-[280px] h-screen overflow-hidden transition-all duration-300">

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="flex-1 overflow-y-auto relative w-full" th:insert="${content}">
    </div>

</main>

<script>
    // Khởi tạo thư viện Icon Lucide
    lucide.createIcons();

    // Hàm toàn cục để Đóng/Mở Sidebar trên Mobile
    function toggleSidebar() {
        // Lấy element sidebar (em cần đặt id="sidebar" ở thẻ <nav> trong file sidebar.html)
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('mobile-overlay');

        if (sidebar) {
            // Thêm/Xóa class '-translate-x-full' để kéo menu ra/vào
            sidebar.classList.toggle('-translate-x-full');

            // Xử lý bật/tắt lớp phủ nền mờ
            if (sidebar.classList.contains('-translate-x-full')) {
                overlay.classList.add('hidden'); // Ẩn lớp phủ nếu menu đóng
            } else {
                overlay.classList.remove('hidden'); // Hiện lớp phủ nếu menu mở
            }
        }
    }
</script>
</body>
</html>
