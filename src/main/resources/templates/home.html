<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Trang chủ | Café Harmony', 'home', ~{::section})}">
<body>
<section class="p-4 md:p-8">

    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 md:mb-8 gap-4">
        <div>
            <h2 class="text-xl md:text-3xl font-bold text-[#1a1c1b] font-sans">Xin chào, <span
                    th:text="${currentUser != null ? currentUser.hoTen : 'Admin'}">Admin</span>! 👋</h2>
            <p class="text-[#50453e] mt-1 opacity-80 text-xs md:text-sm">Hôm nay là một ngày tuyệt vời để phục vụ những
                ly cà phê ngon.</p>
        </div>

        <a th:href="@{/tables}"
           class="w-full sm:w-auto flex items-center justify-center gap-2 bg-[#553722] hover:bg-[#6f4e37] text-white px-5 py-2.5 rounded-xl text-sm font-semibold uppercase tracking-wider transition-all shadow-md shrink-0">
            <i data-lucide="coffee" class="w-4 h-4"></i>
            Đến Sơ đồ bàn ngay
        </a>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mb-6 md:mb-8">

        <div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-[#e2e3e1]/60 flex items-center gap-4 hover:shadow-md transition-shadow cursor-pointer">
            <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0">
                <i data-lucide="banknote" class="w-5 h-5 md:w-6 md:h-6"></i>
            </div>
            <div>
                <p class="text-[10px] md:text-[11px] text-gray-500 font-bold uppercase tracking-wider mb-0.5">Doanh thu
                    hôm nay</p>
                <h3 class="text-base md:text-xl font-bold text-[#1a1c1b]"
                    th:text="${#numbers.formatDecimal(doanhThuHomNay, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</h3>
            </div>
        </div>

        <div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-[#e2e3e1]/60 flex items-center gap-4 hover:shadow-md transition-shadow cursor-pointer">
            <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center shrink-0">
                <i data-lucide="shopping-bag" class="w-5 h-5 md:w-6 md:h-6"></i>
            </div>
            <div>
                <p class="text-[10px] md:text-[11px] text-gray-500 font-bold uppercase tracking-wider mb-0.5">Đơn hàng
                    mới</p>
                <h3 class="text-base md:text-xl font-bold text-[#1a1c1b]"
                    th:text="${donHangHomNay} + ' đơn'">0 đơn</h3>
            </div>
        </div>

        <div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-[#e2e3e1]/60 flex items-center gap-4 hover:shadow-md transition-shadow cursor-pointer">
            <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center shrink-0">
                <i data-lucide="users" class="w-5 h-5 md:w-6 md:h-6"></i>
            </div>
            <div>
                <p class="text-[10px] md:text-[11px] text-gray-500 font-bold uppercase tracking-wider mb-0.5">Bàn đang
                    phục vụ</p>
                <h3 class="text-base md:text-xl font-bold text-[#1a1c1b]"
                    th:text="${banDangSuDung} + ' bàn'">0 bàn</h3>
            </div>
        </div>

        <div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-[#e2e3e1]/60 flex items-center gap-4 hover:shadow-md transition-shadow cursor-pointer">
            <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center shrink-0">
                <i data-lucide="cup-soda" class="w-5 h-5 md:w-6 md:h-6"></i>
            </div>
            <div>
                <p class="text-[10px] md:text-[11px] text-gray-500 font-bold uppercase tracking-wider mb-0.5">Món bán
                    chạy</p>
                <h3 class="text-base md:text-xl font-bold text-[#1a1c1b] truncate w-24 md:w-auto"
                    th:text="${monBanChay}">Đang tải...</h3>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6">

        <div class="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-[#e2e3e1]/60 lg:col-span-2">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-bold text-[#1a1c1b] text-base md:text-lg">Tổng quan doanh thu tuần</h3>
                <a th:href="@{/report}" class="text-[#553722] text-xs md:text-sm font-semibold hover:underline">Xem báo
                    cáo</a>
            </div>
            <div class="w-full h-56 md:h-64 relative">
                <canvas id="weeklyRevenueChart"></canvas>
            </div>
        </div>

        <div class="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-[#e2e3e1]/60">
            <h3 class="font-bold text-[#1a1c1b] text-base md:text-lg mb-5 md:mb-6">Hóa đơn vừa xong</h3>
            <div class="space-y-4 md:space-y-5">

                <div th:if="${#lists.isEmpty(hoatDongGanDay)}" class="text-center text-gray-500 text-sm mt-4">
                    Chưa có giao dịch nào hôm nay.
                </div>

                <div th:each="hd, iterStat : ${hoatDongGanDay}" class="flex gap-3 relative">
                    <div class="w-2 h-2 mt-1.5 rounded-full shrink-0 z-10"
                         th:classappend="${iterStat.first ? 'bg-emerald-500' : 'bg-gray-400'}"></div>
                    <div th:if="${!iterStat.last}"
                         class="absolute left-1 top-3.5 bottom-[-16px] w-[1px] bg-gray-200"></div>

                    <div>
                        <p class="text-sm font-semibold text-[#1a1c1b]"
                           th:text="'Thanh toán hóa đơn #' + ${hd.maHoaDon}"></p>
                        <p class="text-[11px] md:text-xs text-gray-500 mt-0.5"
                           th:text="${#temporals.format(hd.ngayGioTao, 'HH:mm')} + ' • ' + ${#numbers.formatDecimal(hd.tongTien, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                        </p>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            // Nhận dữ liệu từ Backend Spring Boot thông qua Thymeleaf
            const chartLabels = /*[[${chartLabels}]]*/ ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            const chartData = /*[[${chartData}]]*/ [0, 0, 0, 0, 0, 0, 0];

            const ctx = document.getElementById('weeklyRevenueChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: 'Doanh thu (VNĐ)',
                        data: chartData,
                        borderColor: '#553722',
                        backgroundColor: 'rgba(85, 55, 34, 0.1)',
                        borderWidth: 2,
                        tension: 0.4, // Tạo đường cong mềm mại
                        fill: true,
                        pointBackgroundColor: '#553722',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: '#553722'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let value = context.raw || 0;
                                    return value.toLocaleString('vi-VN') + ' đ';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#f3f4f6', drawBorder: false },
                            ticks: {
                                callback: function(value) {
                                    if (value >= 1000000) return (value / 1000000) + ' Tr';
                                    if (value >= 1000) return (value / 1000) + ' K';
                                    return value;
                                }
                            }
                        },
                        x: {
                            grid: { display: false, drawBorder: false }
                        }
                    }
                }
            });
        });
    </script>
</section>
</body>
</html>
